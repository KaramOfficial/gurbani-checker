<!doctype html>
<html lang="pa">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>ਨਿਤਨੇਮ ਟ੍ਰੈਕਰ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500;600&family=Noto+Serif+Gurmukhi:wght@400;500;600;700&family=Noto+Sans+Gurmukhi:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        /* ORVANE-inspired dawn palette: parchment, midnight ink, restrained gold. */
        --bg: #faf6ec;
        --surface: #fffdf6;
        --surface-alt: #f1e8d2;
        --text: #131a2a;
        --dim: #7d7466;
        --border: #e3d7bd;
        --accent: #b8862f;
        --accent-strong: #96690f;
        --gold-bright: #e9c46a;
        --playing-bg: #f6e7bd;
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c1425;
          --surface: #131c33;
          --surface-alt: #1b2742;
          --text: #f0e8d5;
          --dim: #a9a08c;
          --border: #2c3a5c;
          --accent: #d9a83f;
          --accent-strong: #eec25e;
          --gold-bright: #e9c46a;
          --playing-bg: #2e3c5e;
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "Noto Serif Gurmukhi", "Noto Sans Gurmukhi", Georgia, serif;
        min-height: 100vh;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }
      button { font-family: inherit; cursor: pointer; }
      .font-display { font-family: "Cormorant Garamond", "Noto Serif Gurmukhi", Georgia, serif; }
      .font-label { font-family: "Jost", "Noto Sans Gurmukhi", system-ui, sans-serif; }
      .wrap { max-width: 42rem; margin: 0 auto; padding-left: 1.25rem; padding-right: 1.25rem; }
      .wrap-tight { max-width: 42rem; margin: 0 auto; padding-left: 1rem; padding-right: 1rem; }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }

      /* Masthead */
      .masthead { text-align: center; padding-top: 2rem; }
      .kicker {
        font-family: "Jost", "Noto Sans Gurmukhi", system-ui, sans-serif;
        font-size: 11px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 0.35em; color: var(--accent); margin: 0;
      }
      .masthead h1 { margin: 0.5rem 0 0; font-size: 34px; font-weight: 600; line-height: 1.25; }
      .rule { display: flex; align-items: center; gap: 0.75rem; max-width: 220px; margin: 1rem auto 0; }
      .rule .bar { height: 1px; flex: 1; background: var(--border); }
      .rule .diamond { width: 6px; height: 6px; transform: rotate(45deg); background: var(--accent); flex: none; }
      .bani-name { margin: 1rem 0 0; font-size: 26px; font-weight: 600; line-height: 1.4; }
      .learned-count { margin: 0.25rem 0 0; font-size: 14px; color: var(--dim); }
      .next-link {
        margin-top: 0.25rem; padding: 0; border: none; background: none;
        font-size: 14px; color: var(--accent-strong);
        text-decoration: underline dotted; text-underline-offset: 4px;
      }
      .all-done { margin: 0.25rem 0 0; font-size: 14px; font-weight: 500; color: var(--accent-strong); }

      /* Sticky header */
      header.controls {
        position: sticky; top: 0; z-index: 20;
        border-bottom: 1px solid var(--border);
        background: color-mix(in srgb, var(--bg) 95%, transparent);
        backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      }
      .controls-inner { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .controls-row { display: flex; align-items: center; justify-content: flex-end; gap: 0.5rem; }
      .pill-btn {
        border-radius: 999px; border: 1px solid var(--border);
        background: var(--surface); color: var(--dim);
        padding: 0.375rem 0.75rem; font-size: 14px; font-weight: 500;
      }
      .pill-btn.on { border-color: var(--accent); background: var(--surface-alt); color: var(--text); }
      .pill-btn.solid { color: var(--text); }

      /* Bani selector */
      .bani-strip {
        display: flex; gap: 0.5rem; overflow-x: auto;
        margin: 0.75rem -1rem 0; padding: 0 1rem 0.25rem;
        scrollbar-width: none;
      }
      .bani-strip::-webkit-scrollbar { display: none; }
      .bani-tab {
        flex: none; border: none; text-align: left; border-radius: 999px;
        padding: 0.5rem 1rem; background: var(--surface); color: var(--text);
        box-shadow: inset 0 0 0 1px var(--border);
        transition: background 0.2s, color 0.2s;
      }
      .bani-tab .bn { display: block; font-size: 15px; font-weight: 600; line-height: 1.3; }
      .bani-tab .bc { display: block; font-size: 12px; line-height: 1.3; color: var(--dim); }
      .bani-tab.selected { background: var(--text); color: var(--bg); box-shadow: 0 2px 10px rgba(19,26,42,0.25); }
      .bani-tab.selected .bc { color: var(--gold-bright); }

      /* Progress */
      .progress-row { display: flex; align-items: center; gap: 0.75rem; margin-top: 0.625rem; }
      .progress-track { height: 6px; flex: 1; overflow: hidden; border-radius: 999px; background: var(--surface-alt); }
      .progress-fill { height: 100%; border-radius: 999px; background: var(--accent); transition: width 0.5s ease; }
      .progress-pct {
        flex: none; font-size: 12px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 0.18em; color: var(--dim); margin: 0;
      }

      /* Sections */
      main { padding-bottom: 4rem; }
      main.playing { padding-bottom: 11rem; }
      .sections { display: flex; flex-direction: column; gap: 2rem; padding-top: 2rem; }
      @keyframes leaf-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      .leaf { animation: leaf-in 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
      @media (prefers-reduced-motion: reduce) { .leaf { animation: none; } }
      section.leaf, article.leaf { scroll-margin-top: 14rem; }
      .display-only { padding: 0.5rem 0.5rem 0; text-align: center; break-inside: avoid; }
      .display-only .big-line { font-size: 24px; font-weight: 600; line-height: 1.6; margin: 0; }
      .paudi-card {
        border: 1px solid var(--border); border-radius: var(--radius);
        background: var(--surface); padding: 1.5rem 1rem;
        box-shadow: 0 10px 30px rgba(19,26,42,0.07);
      }
      @media (min-width: 640px) { .paudi-card { padding-left: 2rem; padding-right: 2rem; } }
      .card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; margin-bottom: 1.25rem; }
      .sec-kicker {
        font-size: 10px; font-weight: 500; text-transform: uppercase;
        letter-spacing: 0.3em; color: var(--dim); margin: 0;
      }
      .sec-name { margin: 0.125rem 0 0; font-size: 24px; font-weight: 600; line-height: 1.35; color: var(--accent-strong); }
      .sec-dur { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .play-btn {
        flex: none; display: flex; align-items: center; gap: 0.5rem;
        border: none; border-radius: 999px; background: var(--text);
        color: var(--gold-bright); padding: 0.5rem 1rem;
        font-size: 14px; font-weight: 600;
        box-shadow: 0 2px 10px rgba(19,26,42,0.25);
      }
      .print-sec-name { display: none; }
      .lines { display: flex; flex-direction: column; gap: 0.375rem; }
      .bani-line {
        border-radius: 0.5rem; padding: 0.25rem 0.5rem; margin: 0;
        text-align: center; font-size: 22px; line-height: 1.95;
        transition: background 0.2s;
      }
      .bani-line.timed { cursor: pointer; }
      .bani-line.playing-line {
        background: var(--playing-bg); font-weight: 600;
        box-shadow: inset 0 0 0 1px var(--gold-bright);
      }
      .arth-line {
        padding: 0 0.5rem 0.25rem; margin: 0; text-align: center;
        font-size: 15px; line-height: 1.7; color: var(--dim);
      }
      .state-row {
        display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem;
        border-top: 1px solid var(--border); margin-top: 1.25rem; padding-top: 1rem;
      }
      .state-btn {
        border: none; border-radius: 999px; padding: 0.5rem 0.875rem;
        font-size: 14px; font-weight: 500;
        background: var(--surface-alt); color: var(--dim);
        transition: background 0.2s, color 0.2s;
      }
      .state-btn.sel { background: var(--surface-alt); color: var(--text); box-shadow: inset 0 0 0 1px var(--accent); }
      .state-btn.sel.learned { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(184,134,47,0.4); }

      /* Footer */
      footer.foot { padding-top: 3rem; text-align: center; }
      footer.foot .rule { margin-bottom: 1.25rem; }
      footer.foot p { font-size: 14px; color: var(--dim); margin: 0; }
      footer.foot p + p { margin-top: 0.25rem; }

      /* Now-playing bar */
      .now-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
        border-top: 1px solid color-mix(in srgb, var(--gold-bright) 50%, transparent);
        background: var(--surface);
        box-shadow: 0 -6px 24px rgba(19,26,42,0.14);
      }
      .now-inner { padding-top: 0.75rem; padding-bottom: 0.75rem; }
      .now-top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }
      .now-title { margin: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .now-time { margin: 0; flex: none; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
      .now-controls { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.375rem; }
      .skip-btn {
        flex: none; border: none; border-radius: 999px;
        background: var(--surface-alt); color: var(--text);
        padding: 0.5rem 0.75rem; font-size: 14px; font-weight: 600;
      }
      .seek { height: 2rem; min-width: 0; flex: 1; accent-color: var(--accent); }
      .np-toggle {
        flex: none; display: flex; align-items: center; gap: 0.375rem;
        border: none; border-radius: 999px; background: var(--text);
        color: var(--gold-bright); padding: 0.5rem 0.875rem;
        font-size: 14px; font-weight: 600;
      }
      .np-close {
        flex: none; display: flex; align-items: center; justify-content: center;
        border: none; border-radius: 999px; background: var(--surface-alt);
        color: var(--text); padding: 0.5rem; width: 2.25rem; height: 2.25rem;
      }
      [hidden] { display: none !important; }

      /* Print: only the Bani text — no arth, no UI chrome. */
      @media print {
        :root {
          --bg: #ffffff; --surface: #ffffff; --text: #000000;
          --dim: #333333; --border: #ffffff; --playing-bg: #ffffff;
        }
        body { background: #ffffff; }
        .no-print { display: none !important; }
        main { padding: 0 !important; }
        .sections { padding-top: 0; gap: 1rem; }
        .paudi-card {
          break-inside: avoid; page-break-inside: avoid;
          border: none !important; box-shadow: none !important;
          background: #ffffff !important; padding: 10px 0 !important;
          animation: none !important;
        }
        .display-only { animation: none !important; }
        .print-sec-name {
          display: block; text-align: center; font-size: 16px; font-weight: 600;
          color: var(--accent-strong); margin: 0 0 0.75rem;
        }
        .bani-line { color: #000000 !important; background: transparent !important; box-shadow: none !important; }
      }
    </style>
  <link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#131a2a" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Nitnem" />
</head>
  <body>
    <audio id="audio" preload="none"></audio>

    <!-- Masthead: quiet editorial title block, like a gutka's opening leaf -->
    <div class="no-print wrap pt-safe">
      <div class="masthead">
        <p class="kicker">Nitnem · Dawn Paath</p>
        <h1>ਨਿਤਨੇਮ</h1>
        <div class="rule" aria-hidden="true"><span class="bar"></span><span class="diamond"></span><span class="bar"></span></div>
        <p class="font-display bani-name" id="baniName"></p>
        <p class="learned-count" id="learnedCount"></p>
        <button type="button" class="next-link" id="nextLink" hidden></button>
        <p class="all-done" id="allDone" hidden></p>
      </div>
    </div>

    <!-- Sticky control strip: bani selector, arth toggle, progress, print -->
    <header class="controls no-print pt-safe">
      <div class="wrap-tight controls-inner">
        <div class="controls-row">
          <button type="button" class="pill-btn" id="arthBtn" aria-pressed="false" hidden>ਅਰਥ ਵੇਖੋ</button>
          <button type="button" class="pill-btn solid" id="printBtn">ਪ੍ਰਿੰਟ ਕਰੋ</button>
          <button type="button" class="pill-btn" id="langBtn" aria-label="Switch to English">English</button>
        </div>
        <div class="bani-strip" role="tablist" aria-label="ਬਾਣੀ ਚੁਣੋ" id="baniStrip"></div>
        <div class="progress-row">
          <div class="progress-track" role="progressbar" id="progressTrack" aria-valuemin="0">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
          </div>
          <p class="progress-pct font-label" id="progressPct">੦%</p>
        </div>
      </div>
    </header>

    <main class="wrap-tight" id="main">
      <div class="sections" id="sections"></div>
      <footer class="foot no-print">
        <div class="rule" aria-hidden="true"><span class="bar"></span><span class="diamond"></span><span class="bar"></span></div>
        <p id="footCredit">ਬਾਣੀ ਅਤੇ ਆਡੀਓ: Learn Shudh Gurbani (Gursevak)</p>
        <p id="arthSource" hidden></p>
      </footer>
    </main>

    <!-- Now-playing bar: timing + seek controls -->
    <div class="now-bar no-print" id="nowBar" hidden>
      <div class="wrap-tight now-inner pb-safe">
        <div class="now-top">
          <p class="now-title" id="nowTitle"></p>
          <p class="now-time" id="nowTime" aria-label="ਆਡੀਓ ਦਾ ਸਮਾਂ">0:00 / 0:00</p>
        </div>
        <div class="now-controls">
          <button type="button" class="skip-btn" id="backBtn" aria-label="ਦਸ ਸਕਿੰਟ ਪਿੱਛੇ">−10</button>
          <input type="range" class="seek" id="seek" min="0" max="1000" value="0" aria-label="ਆਡੀਓ ਅੱਗੇ ਪਿੱਛੇ ਕਰੋ" />
          <button type="button" class="skip-btn" id="fwdBtn" aria-label="ਦਸ ਸਕਿੰਟ ਅੱਗੇ">+10</button>
          <button type="button" class="np-toggle" id="pauseBtn" aria-label="ਆਡੀਓ ਰੋਕੋ"></button>
          <button type="button" class="np-close" id="closeBtn" aria-label="ਆਡੀਓ ਬੰਦ ਕਰੋ">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l10 10M12 2L2 12" /></svg>
          </button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      // Master Bani data, embedded verbatim at build time.
      // Line fields: t = Bani line exactly as in the Learn Shudh Gurbani app
      // (vishraam marks included); a = Ang number (mode "ang"); s/e = start/end

ੀ ਦਾ ਦਰਵਾਜਾ।"}, {"t": "ਨਾਨਕ. ਏਵੈ ਜਾਣੀਐ; ਸਭੁ ਆਪੇ ਸਚਿਆਰੁ ॥੪॥", "a": 2, "s": 100.13, "e": 107.86, "m": "ਇਸ ਤਰ੍ਹਾਂ ਸਮਝ ਲੈ, ਹੇ ਨਾਨਕ! ਕਿ ਸਤਿਪੁਰਖ ਸਾਰਾ ਕੁਛ ਆਪਣੇ ਆਪ ਤੋਂ ਹੀ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੫", "lines": [{"t": "ਥਾਪਿਆ. ਨ ਜਾਇ; ਕੀਤਾ. ਨ ਹੋਇ ॥", "a": 2, "s": 107.91, "e": 114.18, "m": "ਉਹ ਕਿਸੇ ਦਾ ਨਾਂ ਅਸਥਾਪਨ ਕੀਤਾ ਅਤੇ ਨਾਂ ਹੀ ਬਣਾਇਆ ਹੋਇਆ ਹੈ।"}, {"t": "ਆਪੇ ਆਪਿ ਨਿਰੰਜਨੁ ਸੋਇ ॥", "a": 2, "s": 115.07, "e": 120.92, "m": "ਉਹ ਪਵਿਤਰ ਪੁਰਖ ਸਾਰਾ ਕੁਛ ਆਪ ਹੀ ਹੈ।"}, {"t": "ਜਿਨਿ ਸੇਵਿਆ ਤਿਨਿ ਪਾਇਆ ਮਾਨੁ ॥", "a": 2, "s": 121.49, "e": 127.56, "m": "ਜਿਨ੍ਹਾਂ ਨੇ ਉਸ ਦੀ ਟਹਿਲ ਸੇਵਾ ਕਮਾਈ, ਉਨ੍ਹਾਂ ਨੂੰ ਇਜ਼ਤ ਪਰਾਪਤ ਹੋਈ।"}, {"t": "ਨਾਨਕ ਗਾਵੀਐ ਗੁਣੀ ਨਿਧਾਨੁ ॥", "a": 2, "s": 127.71, "e": 133.02, "m": "ਹੇ ਨਾਨਕ! ਉਸ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਗਾਇਨ ਕਰ ਜੋ ਉਤਕ੍ਰਿਸ਼ਟਰਾਈਆਂ ਦਾ ਖ਼ਜ਼ਾਨਾ ਹੈ।"}, {"t": "ਗਾਵੀਐ ਸੁਣੀਐ ਮਨਿ ਰਖੀਐ ਭਾਉ ॥", "a": 2, "s": 133.41, "e": 140.52, "m": "ਪ੍ਰਭੂ ਦੀ ਪ੍ਰੀਤ ਨੂੰ ਆਪਣੇ ਦਿਲ ਅੰਦਰ ਟਿਕਾ ਕੇ ਉਸ ਦੀ ਕੀਰਤੀ ਗਾਇਨ ਤੇ ਸਰਵਣ ਕਰ।"}, {"t": "ਦੁਖੁ ਪਰਹਰਿ; ਸੁਖੁ ਘਰਿ ਲੈ ਜਾਇ ॥", "a": 2, "s": 140.65, "e": 149.42, "m": "ਇਸ ਤਰ੍ਹਾਂ ਤੇਰੀ ਤਕਲੀਫ ਦੂਰ ਹੋ ਜਾਵੇਗੀ ਅਤੇ ਤੂੰ ਖੁਸ਼ੀ ਆਪਣੇ ਗ੍ਰਹਿ ਨੂੰ ਲੈ ਜਾਵੇਂਗਾ।"}, {"t": "ਗੁਰਮੁਖਿ ਨਾਦੰ. ਗੁਰਮੁਖਿ ਵੇਦੰ; ਗੁਰਮੁਖਿ ਰਹਿਆ ਸਮਾਈ ॥", "a": 2, "s": 150.27, "e": 163.02, "m": "ਗੁਰਬਾਣੀ ਰੱਬੀ ਕਲਾਮ ਹੈ, ਗੁਰਬਾਨੀ ਸਾਹਿਬ ਦਾ ਗਿਆਨ ਅਤੇ ਗੁਰਬਾਣੀ ਰਾਹੀਂ ਹੀ ਸੁਆਮੀ ਨੂੰ ਸਾਰੇ ਵਿਆਪਕ ਅਨੁਭਵ ਕੀਤਾ ਜਾਂਦਾ ਹੈ।"}, {"t": "ਗੁਰੁ ਈਸਰੁ. ਗੁਰੁ ਗੋਰਖੁ. ਬਰਮਾ ਗੁਰੁ; ਪਾਰਬਤੀ ਮਾਈ ॥", "a": 2, "s": 163.61, "e": 178.1, "m": "ਗੁਰੂ ਸ਼ਿਵ ਹੈ, ਗੁਰੂ ਹੀ ਵਿਸ਼ਨੂੰ ਤੇ ਬ੍ਰਹਮਾਂ, ਗੁਰੂ ਹੀ ਸ਼ਿਵ ਦੀ ਪਤਨੀ-ਪਾਰਬਤੀ, ਵਿਸ਼ਨੂੰ ਦੀ ਪਤਨੀ ਲਖਸ਼ਮੀ ਅਤੇ ਬ੍ਰਹਮਾ ਦੀ ਪਤਨੀ-ਸੁਰਸਵਤੀ ਹੈ।"}, {"t": "ਜੇ ਹਉ ਜਾਣਾ, ਆਖਾ ਨਾਹੀ; ਕਹਣਾ ਕਥਨੁ ਨ ਜਾਈ ॥", "a": 2, "s": 178.59, "e": 188.18, "m": "ਭਾਵੇਂ ਮੈਂ ਵਾਹਿਗੁਰੂ ਨੂੰ ਜਾਣਦਾ ਹਾਂ, ਮੈਂ ਉਸ ਨੂੰ ਵਰਣਨ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਬਚਨਾ ਦੁਆਰਾ ਉਹ ਬਿਆਨ ਨਹੀਂ ਕੀਤਾ ਜਾ ਸਕਦਾ।"}, {"t": "ਗੁਰਾ; ਇਕ ਦੇਹਿ ਬੁਝਾਈ ॥", "a": 2, "s": 188.53, "e": 193.2, "m": "ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਇਕ ਚੀਜ਼ ਸਮਝਾ ਦਿਤੀ ਹੈ।"}, {"t": "ਸਭਨਾ ਜੀਆ ਕਾ ਇਕੁ ਦਾਤਾ; ਸੋ. ਮੈ ਵਿਸਰਿ ਨ ਜਾਈ ॥੫॥", "a": 2, "s": 193.23, "e": 203.98, "m": "ਸਮੂਹ ਜੀਵਾਂ ਦਾ ਕੇਵਲ ਇਕ ਦਾਤਾਰ ਹੈ। ਉਹ ਮੈਨੂੰ ਕਦੇ ਭੀ ਨਾਂ ਭੁਲੇ।"}]}, {"name": "ਪਉੜੀ ੬", "lines": [{"t": "ਤੀਰਥਿ ਨਾਵਾ. ਜੇ ਤਿਸੁ ਭਾਵਾ; ਵਿਣੁ ਭਾਣੇ. ਕਿ ਨਾਇ ਕਰੀ ॥", "a": 2, "s": 204.33, "e": 216.54, "m": "ਜੇਕਰ ਮੈਂ ਉਸਨੂੰ ਚੰਗਾ ਲੱਗ ਜਾਵਾਂ ਤਾਂ ਇਹੀ ਮੇਰਾ ਧਰਮ ਅਸਥਾਨ ਤੇ ਨ੍ਹਾਉਣਾ ਹੈ। ਉਸਨੂੰ ਚੰਗਾ ਲੱਗਣ ਦੇ ਬਿਨਾ ਇਸ਼ਨਾਨ ਦਾ ਕੀ ਲਾਭ ਹੈ?"}, {"t": "ਜੇਤੀ ਸਿਰਠਿ. ਉਪਾਈ ਵੇਖਾ; ਵਿਣੁ ਕਰਮਾ. ਕਿ ਮਿਲੈ ਲਈ ॥", "a": 2, "s": 216.73, "e": 227.2, "m": "ਸਮੂਹ ਸਾਜੇ ਹੋਏ ਜੀਵਾਂ ਨੂੰ ਜਿਹੜੇ ਮੈਂ ਤਕਦਾ ਹਾਂ, ਸ਼ੁਭ ਅਮਲਾਂ ਬਾਝੋਂ ਉਨ੍ਹਾਂ ਨੂੰ ਕੀ ਮਿਲਦਾ ਹੈ, ਅਤੇ ਉਹ ਕੀ ਲੈਂਦੇ ਹਨ?"}, {"t": "ਮਤਿ ਵਿਚਿ ਰਤਨ ਜਵਾਹਰ ਮਾਣਿਕ; ਜੇ ਇਕ ਗੁਰ ਕੀ ਸਿਖ ਸੁਣੀ ॥", "a": 2, "s": 227.35, "e": 239.7, "m": "ਮਨ ਅੰਦਰ ਹੀਰੇ ਜਵਾਹਰ ਤੇ ਲਾਲ ਹਨ, ਜੇਕਰ ਤੂੰ ਗੁਰਾਂ ਦੀ ਇਕ ਭੀ ਸਿਖਿਆ ਸਰਵਣ ਕਰਕੇ ਅਮਲ ਕਰ ਲਵੇਂ।"}, {"t": "ਗੁਰਾ; ਇਕ ਦੇਹਿ ਬੁਝਾਈ ॥", "a": 2, "s": 240.03, "e": 244.6, "m": "ਗੁਰੂ ਨੇ ਮੈਨੂੰ ਇਕ ਗਲ ਸਮਝਾ ਦਿਤੀ ਹੈ।"}, {"t": "ਸਭਨਾ ਜੀਆ ਕਾ ਇਕੁ ਦਾਤਾ; ਸੋ. ਮੈ ਵਿਸਰਿ ਨ ਜਾਈ ॥੬॥", "a": 2, "s": 244.75, "e": 254.42, "m": "ਸਮੂਹ ਜੀਵਾਂ ਦਾ ਕੇਵਲ ਇਕ ਦਾਤਾਰ ਹੈ। ਉਹ ਮੈਨੂੰ ਕਦੇ ਭੀ ਨਾਂ ਭੁੱਲੇ।"}]}, {"name": "ਪਉੜੀ ੭", "lines": [{"t": "ਜੇ ਜੁਗ ਚਾਰੇ ਆਰਜਾ; ਹੋਰ ਦਸੂਣੀ ਹੋਇ ॥", "a": 2, "s": 254.89, "e": 261.54, "m": "ਭਾਵੇਂ ਇਨਸਾਨ ਦੀ ਉਮਰ ਚਾਰ ਜੁਗਾਂ ਦੀ ਹੋਵੇ ਅਤੇ ਦਸ ਗੁਣਾ ਵਧੇਰੇ ਭੀ ਹੋ ਜਾਏ।"}, {"t": "ਨਵਾ ਖੰਡਾ ਵਿਚਿ ਜਾਣੀਐ; ਨਾਲਿ ਚਲੈ ਸਭੁ ਕੋਇ ॥", "a": 2, "s": 262.21, "e": 270.9, "m": "ਭਾਵੇਂ ਉਹ ਨਵਾਂ ਹੀ ਮਹਾਦੀਪਾਂ ਅੰਦਰਿ ਪ੍ਰਸਿਧ ਹੋਵੇ ਅਤੇ ਸਾਰੇ ਉਸ ਦੇ (ਮਗਰ ਲੱਗਦੇ ਜਾਂ ਨਾਲ ਟੁਰਦੇ) ਹੋਣ,"}, {"t": "ਚੰਗਾ ਨਾਉ ਰਖਾਇ ਕੈ; ਜਸੁ ਕੀਰਤਿ ਜਗਿ ਲੇਇ ॥", "a": 2, "s": 270.93, "e": 280.7, "m": "ਤੇ ਭਾਵੇਂ ਉਹ ਸਰੇਸ਼ਟ ਨਾਮ ਰਖਵਾ ਲਵੇ ਅਤੇ ਸੰਸਾਰ ਅੰਦਰ ਉਪਮਾ ਤੇ ਸ਼ੋਭਾ ਪਰਾਪਤ ਕਰ ਲਵੇ।"}, {"t": "ਜੇ ਤਿਸੁ ਨਦਰਿ ਨ ਆਵਈ; ਤ ਵਾਤ ਨ ਪੁਛੈ ਕੇ ॥", "a": 2, "s": 281.39, "e": 291.88, "m": "ਜੇਕਰ ਉਹ ਉਸ ਦੀ ਦਯਾ ਦ੍ਰਿਸ਼ਟੀ ਦਾ ਪਾਤਰ ਨਹੀਂ, ਤਦ, ਉਸ ਦੀ ਕੋਈ ਪਰਵਾਹ ਨਹੀਂ ਕਰੇਗਾ,"}, {"t": "ਕੀਟਾ ਅੰਦਰਿ ਕੀਟੁ ਕਰਿ; ਦੋਸੀ ਦੋਸੁ ਧਰੇ ॥", "a": 2, "s": 292.19, "e": 301.92, "m": "ਉਹ ਕੀੜਿਆਂ ਵਿੱਚ ਨੀਚ ਮਕੌੜਾ ਗਿਣਿਆ ਜਾਂਦਾ ਹੈ ਅਤੇ ਪਾਂਬਰ ਭੀ ਉਸ ਉਤੇ ਦੁਸ਼ਨ ਲਾਉਂਦੇ ਹਨ।"}, {"t": "ਨਾਨਕ. ਨਿਰਗੁਣਿ ਗੁਣੁ ਕਰੇ; ਗੁਣਵੰਤਿਆ ਗੁਣੁ ਦੇ ॥", "a": 2, "s": 302.39, "e": 313.5, "m": "ਹੇ ਨਾਨਕ! ਵਾਹਿਗੁਰੂ ਨੇਕੀ-ਬਿਹੁਨਾ ਨੂੰ ਨੇਕੀ ਬਖਸ਼ਦਾ ਹੈ ਅਤੇ ਪਵਿੱਤਰ ਆਤਮਾਵਾਂ ਨੂੰ ਪਵਿਤ੍ਰਤਾਈ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"}, {"t": "ਤੇਹਾ ਕੋਇ ਨ ਸੁਝਈ; ਜਿ ਤਿਸੁ ਗੁਣੁ ਕੋਇ ਕਰੇ ॥੭॥", "a": 2, "s": 314.03, "e": 324.86, "m": "ਮੈਂ ਕਿਸੇ ਇਹੋ ਜੇਹੇ ਦਾ ਖਿਆਲ ਨਹੀਂ ਕਰ ਸਕਦਾ ਜਿਹੜਾ ਉਸ ਉਤੇ ਕੋਈ ਮਿਹਰਬਾ ": 4, "s": 319.23, "e": 330.44, "m": "ਅਤੇ ਉਹ ਕਿਹੜਾ ਮੌਸਮ ਅਤੇ ਕਿਹੜਾ ਮਹੀਨਾ ਸੀ, ਜਦ ਸੰਨਸਾਰ (ਰਚਨਾ) ਦਾ ਪਸਾਰਾ ਹੋਇਆ?"}, {"t": "ਵੇਲ. ਨ ਪਾਈਆ ਪੰਡਤੀ; ਜਿ ਹੋਵੈ ਲੇਖੁ ਪੁਰਾਣੁ ॥", "a": 4, "s": 330.85, "e": 339.16, "m": "ਪੰਡਤਾ ਨੂੰ ਵੇਲੇ ਦਾ ਪਤਾ ਨਹੀਂ ਭਾਵੇਂ ਪੁਰਾਨਾ ਦੀ ਲਿਖਤ ਅੰਦਰ ਇਸ ਦਾ ਜ਼ਿਕਰ ਭੀ ਹੋਵੇ।"}, {"t": "ਵਖਤੁ. ਨ ਪਾਇਓ ਕਾਦੀਆ; ਜਿ ਲਿਖਨਿ ਲੇਖੁ ਕੁਰਾਣੁ ॥", "a": 4, "s": 340.29, "e": 350.52, "m": "ਨਾਂ ਹੀ ਕਾਜ਼ੀ, ਜਿਹੜੇ ਕੁਰਾਨ ਦੀ ਲਿਖਤ ਲਿਖਦੇ ਹਨ, ਸਮੇ ਨੂੰ ਜਾਣਦੇ ਹਨ।"}, {"t": "ਥਿਤਿ ਵਾਰੁ ਨਾ ਜੋਗੀ ਜਾਣੈ; ਰੁਤਿ ਮਾਹੁ ਨਾ ਕੋਈ ॥", "a": 4, "s": 351.61, "e": 360.18, "m": "ਨਾਂ ਯੋਗੀ, ਨਾਂ ਹੀ ਕੋਈ ਹੋਰ, ਚੰਦ ਦਾ ਦਿਹਾੜਾ, ਸਪਤਾਹ ਦਾ ਦਿਨ, ਮੌਸਮ ਅਤੇ ਮਹੀਨਾ ਜਾਣਦਾ ਹੈ।"}, {"t": "ਜਾ ਕਰਤਾ ਸਿਰਠੀ ਕਉ ਸਾਜੇ; ਆਪੇ ਜਾਣੈ ਸੋਈ ॥", "a": 4, "s": 360.39, "e": 367.66, "m": "ਜੋ ਸਿਰਜਣਹਾਰ ਸ੍ਰਿਸ਼ਟੀ ਨੂੰ ਰਚਦਾ ਹੈ, ਉਹ ਆਪ ਹੀ ਵੇਲੇ ਨੂੰ ਜਾਣਦਾ ਹੈ।"}, {"t": "ਕਿਵ ਕਰਿ ਆਖਾ, ਕਿਵ ਸਾਲਾਹੀ; ਕਿਉ ਵਰਨੀ. ਕਿਵ ਜਾਣਾ ॥", "a": 4, "s": 367.93, "e": 377.98, "m": "ਤੈਨੂੰ ਕਿਸ ਤਰ੍ਹਾਂ ਕਹਿਆ ਕਿਸ ਤਰ੍ਹਾਂ ਸਲਾਹਿਆ ਕਿਸ ਤਰ੍ਹਾਂ ਬਿਆਨ ਕੀਤਾ ਅਤੇ ਕਿਸ ਤਰ੍ਹਾਂ ਜਾਣਿਆ ਜਾਵੇ ਹੇ ਸਾਈਂ?"}, {"t": "ਨਾਨਕ. ਆਖਣਿ ਸਭੁ ਕੋ ਆਖੈ; ਇਕ ਦੂ ਇਕੁ ਸਿਆਣਾ ॥", "a": 5, "s": 0.21, "e": 8.66, "m": "ਨਾਨਕ! ਸਾਰੇ ਤੇਰੀ ਕਥਾ ਵਰਨਣ ਕਰਦੇ ਹਨ ਤੇ ਇਕ ਨਾਲੋ ਇਕ ਵਧੇਰੇ ਅਕਲਮੰਦ ਹੈ।"}, {"t": "ਵਡਾ ਸਾਹਿਬੁ, ਵਡੀ ਨਾਈ; ਕੀਤਾ ਜਾ ਕਾ ਹੋਵੈ ॥", "a": 5, "s": 9.11, "e": 16.24, "m": "ਵਿਸ਼ਾਲ ਹੈ ਮਾਲਕ ਤੇ ਵਿਸ਼ਾਲ ਉਸ ਦਾ ਨਾਮ ਅਤੇ ਜੋ ਕੁਛ ਉਹ ਕਰਦਾ ਹੈ, ਉਹੀ ਹੁੰਦਾ ਹੈ।"}, {"t": "ਨਾਨਕ. ਜੇ ਕੋ ਆਪੌ ਜਾਣੈ; ਅਗੈ ਗਇਆ ਨ ਸੋਹੈ ॥੨੧॥", "a": 5, "s": 16.37, "e": 26.72, "m": "ਨਾਨਕ! ਜੇਕਰ ਕੋਈ ਜਾਣਾ ਆਪਣੇ ਆਪ ਨੂੰ ਕਰਣ-ਯੋਗ ਮੰਨ ਲਵੇ, ਅਗਲੇ ਲੋਕ ਵਿੱਚ ਪੁੱਜਣ ਤੇ ਉਹ ਸੁਭਾਇਮਾਨ ਨਹੀਂ ਲੱਗੇਗਾ।"}]}, {"name": "ਪਉੜੀ ੨੨", "lines": [{"t": "ਪਾਤਾਲਾ ਪਾਤਾਲ ਲਖ; ਆਗਾਸਾ ਆਗਾਸ ॥", "a": 5, "s": 26.85, "e": 34.46, "m": "ਪਇਆਲਾ ਦੇ ਹੇਠਾਂ ਪਇਆਲ ਹਨ ਅਤੇ ਲਖੂਖ਼ਾ (ਲਖਾਂ) ਅਸਮਾਨਾ ਉਤੇ ਅਸਮਾਨ।"}, {"t": "ਓੜਕ ਓੜਕ ਭਾਲਿ ਥਕੇ; ਵੇਦ ਕਹਨਿ ਇਕ ਵਾਤ ॥", "a": 5, "s": 35.47, "e": 45.28, "m": "ਧਾਰਮਕ ਗ੍ਰੰਥ ਇਕ ਗੱਲ ਆਖਦੇ ਹਨ ਰੱਬ ਦੇ ਅੰਤ ਅਤੇ ਹੱਦ ਬੰਨਿਆਂ ਨੂੰ ਲੱਭਦੇ ਹੋਏ, ਨਾਕਾਮਯਾਬ ਹੋ, ਲੋਕ ਹਾਰ ਹੁਟ ਗਏ ਹਨ।"}, {"t": "ਸਹਸ ਅਠਾਰਹ ਕਹਨਿ ਕਤੇਬਾ; ਅਸੁਲੂ ਇਕੁ ਧਾਤੁ ॥", "a": 5, "s": 45.59, "e": 55.4, "m": "ਯਹੁਦੀ, ਈਸਾਈ ਤੇ ਮੁਸਲਿਮ ਧਾਰਮਕ ਗਰੰਥ ਆਖਦੇ ਹਨ, ਕਿ ਅਠਾਰਾ ਹਜ਼ਾਰ ਆਲਮ ਹਨ, ਪ੍ਰੰਤੂ ਅਸਲ ਵਿੱਚ ਇਕੋ ਹੀ ਸਾਰ-ਤਤ ਹੈ, ਕਿ ਪ੍ਰਭੂ ਬੇਅੰਤ ਹੈ।"}, {"t": "ਲੇਖਾ ਹੋਇ ਤ ਲਿਖੀਐ; ਲੇਖੈ ਹੋਇ ਵਿਣਾਸੁ ॥", "a": 5, "s": 55.47, "e": 62.26, "m": "ਜੇਕਰ ਉਸਦਾ ਕੋਈ ਹਿਸਾਬ ਕਿਤਾਬ ਹੋਵੇ, ਕੇਵਲ ਤਾ ਹੀ ਇਨਸਾਨ ਉਸਨੂੰ ਲਿਖ ਸਕਦਾ ਹੈ ਕਿ ਵਾਹਿਗੁਰੂ ਦਾ ਹਿਸਾਬ ਕਿਤਾਬ ਮੁਕਦਾ ਨਹੀਂ ਅਤੇ ਹਿਸਾਬ ਕਿਤਾਬ ਨੂੰ ਬਿਆਨ ਕਰਦਾ ਹੋਇਆ ਇਨਸਾਨ ਖੁਦ ਹੀ ਮੁਕ ਜਾਂਦਾ ਹੈ।"}, {"t": "ਨਾਨਕ. ਵਡਾ ਆਖੀਐ; ਆਪੇ ਜਾਣੈ ਆਪੁ ॥੨੨॥", "a": 5, "s": 62.31, "e": 67.92, "m": "ਹੇ ਨਾਨਕ! ਉਸਨੂੰ ਵਿਸ਼ਾਲ ਵਰਨਣ ਕਰ। ਉਹ ਆਪ ਹੀ ਆਪਣੇ ਆਪ ਨੂੰ ਜਾਣਦਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੨੩", "lines": [{"t": "ਸਾਲਾਹੀ ਸਾਲਾਹਿ; ਏਤੀ ਸੁਰਤਿ ਨ ਪਾਈਆ ॥", "a": 5, "s": 67.97, "e": 76.28, "m": "ਸ਼ਲਾਘਾ ਕਰਨ ਵਾਲੇ ਸਾਹਿਬ ਦੀ ਸ਼ਲਾਘਾ ਕਰਦੇ ਹਨ, ਪਰ ਉਨ੍ਹਾਂ ਨੂੰ ਏਨੀ ਸਮਝ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੁੰਦੀ"}, {"t": "ਨਦੀਆ ਅਤੈ ਵਾਹ; ਪਵਹਿ ਸਮੁੰਦਿ, ਨ ਜਾਣੀਅਹਿ ॥", "a": 5, "s": 76.77, "e": 85.64, "m": "ਕਿ ਉਸਦੀ ਵਿਸ਼ਾਲਤਾ ਨੂੰ ਜਾਣ ਲੈਣਾ ਹੈ ਇਸ ਤਰਾਂ ਹੈ ਜਿਸ ਤਰ੍ਹਾਂ ਸਮੁੰਦਰ ਵਿੱਚ ਡਿੱਗਣ ਵਾਲੇ ਨਾਲੇ ਤੇ ਦਰਿਆ ਇਸਦੇ ਵਿਸਥਾਰ ਨੂੰ ਨਹੀਂ ਸਮਝਦੇ।"}, {"t": "ਸਮੁੰਦ ਸਾਹ ਸੁਲਤਾਨ; ਗਿਰਹਾ ਸੇਤੀ ਮਾਲੁ ਧਨੁ ॥", "a": 5, "s": 85.95, "e": 96.68, "m": "ਜਾਇਦਾਦ ਅਤੇ ਦੌਲਤ ਦੇ ਸਮੁੰਦਰਾਂ ਤੇ ਪਹਾੜਾਂ ਦੇ ਸਮੇਤਿ, ਰਾਜੇ ਅਤੇ ਮਹਾਰਾਜੇ,"}, {"t": "ਕੀੜੀ ਤੁਲਿ ਨ ਹੋਵਨੀ; ਜੇ ਤਿਸੁ, ਮਨਹੁ ਨ ਵੀਸਰਹਿ ॥੨੩॥", "a": 5, "s": 96.99, "e": 108.79, "m": "ਕੀੜੀ ਦੇ ਬਰਾਬਰ ਨਹੀਂ ਹੁੰਦੇ ਜੋ ਆਪਣੇ ਚਿੱਤ ਅੰਦਰ ਪ੍ਰਭੂ ਨਾ ਭੁਲੇ।"}]}, {"name": "ਪਉੜੀ ੨੪", "lines": [{"t": "ਅੰਤੁ ਨ. ਸਿਫਤੀ; ਕਹਣਿ. ਨ ਅੰਤੁ ॥", "a": 5, "s": 108.79, "e": 115.86, "m": "ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਦਾ ਕੋਈ ਓੜਕ ਨਹੀਂ ਤੇ ਨਾਹੀ ਓੜਕ ਹੈ ਇਸ ਦੇ ਆਖਣ ਵਾਲਿਆਂ ਦਾ।"}, {"t": "ਅੰਤੁ ਨ. ਕਰਣੈ; ਦੇਣਿ. ਨ ਅੰਤੁ ॥", "a": 5, "s": 116.63, "e": 124.02, "m": "ਬੇ-ਅੰਦਾਜ਼ ਹਨ ਉਸਦੇ ਕੰਮ ਅਤੇ ਬੇ-ਅੰਦਾਜ਼ਾ ਉਸ ਦੀਆਂ ਦਾਤਾਂ।"}, {"t": "ਅੰਤੁ ਨ. ਵੇਖਣਿ; ਸੁਣਣਿ. ਨ ਅੰਤੁ ॥", "a": 5, "s": 124.87, "e": 133.48, "m": "ਵਾਹਿਗੁਰੂ ਦੇ ਦੇਖਣ ਦਾ ਕੋਈ ਓੜਕ ਨਹੀਂ ਅਤੇ ਨਾਂ ਹੀ ਓੜਕ ਹੈ ਉਸਦੇ ਸਰਵਣ ਕਰਨ ਦਾ।"}, {"t": "ਅੰਤੁ ਨ ਜਾਪੈ; ਕਿਆ ਮਨਿ ਮੰਤੁ ॥", "a": 5, "s": 133.95, "e": 140.64, "m": "ਸਾਹਿਬ ਦੇ ਦਿਲ ਦਾ ਕੀ ਮਨੋਰਥ ਹੈ? ਇਸ ਦਾ ਓੜਕ ਜਾਣਿਆ ਨਹੀਂ ਜਾਂਦਾ।"}, {"t": "ਅੰਤੁ ਨ ਜਾਪੈ; ਕੀਤਾ ਆਕਾਰੁ ॥", "a": 5, "s": 141.23, "e": 146.86, "m": "ਉਸਦੀ ਰਚੀ ਹੋਈ ਰਚਨਾ ਦਾ ਓੜਕ ਮਲੂਮ ਨਹੀਂ ਹੁੰਦਾ।"}, {"t": "ਅੰਤੁ ਨ ਜਾਪੈ ਪਾਰਾਵਾਰੁ ॥", "a": 5, "s": 147.51, "e": 152.14, "m": "ਉਸਦੇ ਇਸ ਤੇ ਉਸ ਕਿਨਾਰੇ ਦਾ ਥਹੁ ਪਤਾ ਜਾਣਿਆ ਨਹੀਂ ਜਾਂਦਾ।"}, {"t": "ਅੰਤ ਕਾਰਣਿ; ਕੇਤੇ  ਗਾਵਨਿ ਸਾਧ ਵਿਚਾਰੇ ॥", "a": 6, "s": 154.55, "e": 164.44, "m": "ਆਪਣੀ ਧਿਆਨ-ਅਵਸਥਾ ਅੰਦਰ ਪੂਰਨ ਪੁਰਸ਼ ਤੈਨੂੰ ਗਾਇਨ ਕਰਦੇ ਹਨ ਅਤੇ ਸੰਤ ਆਪਣੀ ਦਿੱਭਦ੍ਰਿਸ਼ਟੀ ਅੰਦਰ ਭੀ ਤੈਨੂੰ ਹੀ ਗਾਉਂਦੇ ਹਨ।"}, {"t": "ਗਾਵਨਿ ਜਤੀ ਸਤੀ ਸੰਤੋਖੀ; ਗਾਵਹਿ ਵੀਰ ਕਰਾਰੇ ॥", "a": 6, "s": 164.99, "e": 174.44, "m": "ਕਾਮ ਚੇਸਟਾ ਰਹਿਤ ਸੱਚੇ ਅਤੇ ਸੰਤੁਸ਼ਟ ਪੁਰਸ਼ ਤੇਰਾ ਜਸ ਗਾਉਂਦੇ ਅਤੇ ਨਿਧੜਕ ਯੋਧੇ ਤੇਰੀ ਹੀ ਪ੍ਰਸੰਸਾ ਕਰਦੇ ਹਨ।"}, {"t": "ਗਾਵਨਿ ਪੰਡਿਤ ਪੜਨਿ ਰਖੀਸਰ; ਜੁਗੁ ਜੁਗੁ ਵੇਦਾ ਨਾਲੇ ॥", "a": 6, "s": 174.61, "e": 185.38, "m": "ਸਾਰਿਆਂ ਯੁਗਾਂ ਤੇ ਵੇਦਾਂ ਨੂੰ ਵਾਚਣ ਵਾਲੇ ਵਿਦਵਾਨ ਸਮੇਤ ਸੱਤੇ ਸ਼ਰੋਮਨੀ ਰਿਸ਼ੀਆਂ ਦੇ, ਤੇਰੀ ਹੀ ਪ੍ਰਸੰਸਾ ਕਰਦੇ ਹਨ।"}, {"t": "ਗਾਵਹਿ ਮੋਹਣੀਆ ਮਨੁ ਮੋਹਨਿ; ਸੁਰਗਾ ਮਛ ਪਇਆਲੇ ॥", "a": 6, "s": 186.07, "e": 196.74, "m": "ਮੌਹ ਲੈਣ ਵਾਲੀਆਂ ਪਰੀਆਂ, ਜੋ ਬਹਿਸ਼ਤ, ਇਸ ਲੋਕ ਅਤੇ ਪਾਤਾਲ ਅੰਦਰ ਦਿਲ ਨੂੰ ਛਲ ਲੈਦੀਆਂ ਹਨ, ਤੈਨੂੰ ਗਾਉਂਦੀਆਂ ਹਨ।"}, {"t": "ਗਾਵਨਿ ਰਤਨ ਉਪਾਏ ਤੇਰੇ; ਅਠਸਠਿ ਤੀਰਥ ਨਾਲੇ ॥", "a": 6, "s": 196.79, "e": 206.54, "m": "ਤੇਰੇ ਰਚੇ ਹੋਏ ਚੌਦਾ ਅਮੋਲਕ ਪਦਾਰਥ, ਅਠਾਹਟ ਯਾਤ੍ਰਾ ਅਸਥਾਨ ਸਮੇਤ, ਤੇਰੀ ਕੀਰਤੀ ਕਰਦੇ ਹਨ।"}, {"t": "ਗਾਵਹਿ ਜੋਧ ਮਹਾਬਲ ਸੂਰਾ; ਗਾਵਹਿ ਖਾਣੀ ਚਾਰੇ ॥", "a": 6, "s": 207.01, "e": 216.22, "m": "ਪਰਮ ਬਲਵਾਨ ਯੋਧੇ ਅਤੇ ਈਸ਼ਵਰੀ ਸੂਰਮੇ ਤੈਨੂੰ ਗਾਉਂਦੇ ਹਨ ਅਤੇ ਚਾਰੇ ਹੀ ਉਤਪਤੀ ਦੇ ਮੰਥੇ ਤੈਨੂੰ ਸਲਾਹੁੰਦੇ ਹਨ।"}, {"t": "ਗਾਵਹਿ ਖੰਡ ਮੰਡਲ ਵਰਭੰਡਾ; ਕਰਿ ਕਰਿ ਰਖੇ ਧਾਰੇ ॥", "a": 6, "s": 216.51, "e": 225.5, "m": "ਤੇਰੇ ਹੱਥ ਦੇ ਰਚੇ ਅਤੇ ਅਸਥਾਪਨ ਕੀਤੇ ਹੋਹੇ ਬਰਿਆਜ਼ਮ, ਸੰਸਾਰ ਅਤੇ ਸੂਰਜ-ਬੰਧਾਨ ਤੇਰੀਆਂ ਬਜ਼ੁਰਗੀਆਂ ਅਲਾਪਦੇ ਹਨ।"}, {"t": "ਸੇਈ ਤੁਧੁਨੋ ਗਾਵਹਿ, ਜੋ ਤੁਧੁ ਭਾਵਨਿ; ਰਤੇ ਤੇਰੇ ਭਗਤ ਰਸਾਲੇ ॥", "a": 6, "s": 225.65, "e": 239.14, "m": "ਜੋ ਤੈਂਡੇ ਸਾਧੂ, ਜੇਹੜੇ ਤੈਨੂੰ ਚੰਗੇ ਲੱਗਦੇ ਹਨ ਅਤੇ ਜੋ ਅੰਮ੍ਰਿਤ ਦੇ ਘਰ ਤੇਰੇ ਨਾਮ ਅੰਦਰ ਰੰਗੀਜੇ ਹਨ, ਉਹ ਭੀ ਤੈਨੂੰ ਗਾਉਂਦੇ ਹਨ।"}, {"t": "ਹੋਰਿ ਕੇਤੇ ਗਾਵਨਿ, ਸੇ. ਮੈ ਚਿਤਿ ਨ ਆਵਨਿ; ਨਾਨਕੁ. ਕਿਆ ਵੀਚਾਰੇ ॥", "a": 6, "s": 239.23, "e": 253.14, "m": "ਹੋਰ ਬਹੁਤੇਰੇ, ਜਿਨ੍ਹਾਂ ਨੂੰ ਮੈਂ ਆਪਣੇ ਮਨ ਅੰਦਰ ਚਿਤਵਨ ਨਹੀਂ ਕਰ ਸਕਦਾ, ਤੈਨੂੰ ਗਾਉਂਦੇ ਹਨ। ਨਾਨਕ ਉਨ੍ਹਾਂ ਦਾ ਕਿਸ ਤਰ੍ਹਾਂ ਖਿਆਲ ਕਰ ਸਕਦਾ ਹੈ?"}, {"t": "ਸੋਈ ਸੋਈ ਸਦਾ ਸਚੁ ਸਾਹਿਬੁ; ਸਾਚਾ ਸਾਚੀ ਨਾਈ ॥", "a": 6, "s": 253.65, "e": 263.08, "m": "ਉਹ, ਉਹ ਸੁਆਮੀ ਸਦੀਵ ਹੀ ਸੱਚਾ ਹੈ। ਉਹ ਸੱਤ ਹੈ, ਅਤੇ ਸੱਤ ਹੈ ਉਸ ਦਾ ਨਾਮ।"}, {"t": "ਹੈ ਭੀ ਹੋਸੀ, ਜਾਇ ਨ ਜਾਸੀ; ਰਚਨਾ ਜਿਨਿ ਰਚਾਈ ॥", "a": 6, "s": 263.31, "e": 270.82, "m": "ਜਿਸ ਨੇ ਸ੍ਰਿਸ਼ਟੀ ਸਾਜੀ ਹੈ, ਉਹ ਹੈ ਤੇ ਹੋਵੇਗਾ ਭੀ, ਜਦ ਸ੍ਰਿਸ਼ਟੀ ਅਲੋਪ ਹੋ ਜਾਏਗੀ ਉਹ ਨਹੀਂ ਜਾਵੇਗਾ।"}, {"t": "ਰੰਗੀ ਰੰਗੀ ਭਾਤੀ, ਕਰਿ ਕਰਿ ਜਿਨਸੀ; ਮਾਇਆ ਜਿਨਿ ਉਪਾਈ ॥", "a": 6, "s": 271.17, "e": 279.48, "m": "ਵਾਹਿਗੁਰੂ ਜਿਸ ਨੇ ਸੰਸਾਰ ਸਾਜਿਆ ਹੈ, ਨੇ ਕਈ ਤਰੀਕਿਆਂ ਦੁਆਰਾ ਅਨੇਕਾਂ ਰੰਗਤਾਂ ਅਤੇ ਕਿਸਮਾਂ ਦੀ ਰਚਨਾ ਰਚੀ ਹੈ।"}, {"t": "ਕਰਿ ਕਰਿ ਵੇਖੈ. ਕੀਤਾ ਆਪਣਾ; ਜਿਵ ਤਿਸ ਦੀ ਵਡਿਆਈ ॥", "a": 6, "s": 279.71, "e": 289.38, "m": "ਰਚਨਾ ਨੂੰ ਰੱਚ ਕੇ, ਉਹ ਜਿਸ ਤਰ੍ਹਾਂ ਉਸ ਹਜ਼ੂਰ ਨੂੰ ਚੰਗਾ ਲੱਗਦਾ ਹੈ, ਆਪਣੇ ਕੀਤੇ ਕੰਮ ਨੂੰ ਦੇਖਦਾ ਹੈ।"}, {"t": "ਜੋ ਤਿਸੁ ਭਾਵੈ. ਸੋਈ ਕਰਸੀ; ਹੁਕਮੁ. ਨ ਕਰਣਾ ਜਾਈ ॥", "a": 6, "s": 289.47, "e": 298.34, "m": "ਜੋ ਕੁਛ ਉਸ ਨੂੰ ਭਾਉਂਦਾ ਹੈ, ਉਹੀ ਉਹ ਕਰਦਾ ਹੈ। ਕੋਈ ਜਣਾ ਉਸ ਨੂੰ ਫੁਰਮਾਨ ਜਾਰੀ ਨਹੀਂ ਕਰ ਸਕਦਾ।"}, {"t": "ਸੋ ਪਾਤਿਸਾਹੁ. ਸਾਹਾ ਪਾਤਿਸਾਹਿਬੁ; ਨਾਨਕ. ਰਹਣੁ ਰਜਾਈ ॥੨੭॥", "a": 6, "s": 298.57, "e": 311.6, "m": "ਉਹ ਰਾਜਾ ਹੈ, ਰਾਜਿਆਂ ਦਾ ਮਹਾਰਾਜਾ ਹੈ ਨਾਨਕ ਉਸਦੀ ਰਜ਼ਾ ਦੇ ਤਾਬੇ ਰਹਿੰਦਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੨੮", "lines": [{"t": "ਮੁੰਦਾ ਸੰਤੋਖੁ, ਸਰਮੁ ਪਤੁ ਝੋਲੀ; ਧਿਆਨ ਕੀ. ਕਰਹਿ ਬਿਭੂਤਿ ॥", "a": 6, "s": 311.89, "e": 323.12, "m": "ਸੰਤੁਸ਼ਟਤਾ ਨੂੰ ਆਪਣੀਆਂ ਮੁੰਦ੍ਰਾਂ, ਲਜਿਆਂ ਨੂੰ ਆਪਦਾ ਮੰਗਣ ਵਾਲਾ ਖੱਪਰ ਤੇ ਥੈਲਾ ਅਤੇ ਸਾਹਿਬ ਦੇ ਸਿਮਰਨ ਨੂੰ ਆਪਣੀ ਸੁਆਹ ਬਣਾ।"}, {"t": "ਖਿੰਥਾ, ਕਾਲੁ ਕੁਆਰੀ ਕਾਇਆ; ਜੁਗਤਿ ਡੰਡਾ ਪਰਤੀਤਿ ॥", "a": 6, "s": 324.03, "e": 333.74, "m": "ਮੌਤ ਦਾ ਖਿਆਲ ਤੇਰੀ ਖਫਨੀ, ਕੁਮਾਰੀ ਕੰਨਿਆਂ ਦੇ ਸਰੀਰ ਵਰਗੀ ਪਵਿੱਤ੍ਰਤਾ ਤੇਰੀ ਜੀਵਨ ਰਹੁ-ਰੀਤੀ ਅਤੇ ਵਾਹਿਗੁਰੂ ਵਿੱਚ ਭਰੋਸਾ ਤੇਰਾ ਸੋਟਾ ਹੋਵੇ।"}, {"t": "ਆਈ ਪੰਥੀ ਸਗਲ ਜਮਾਤੀ; ਮਨਿ ਜੀਤੈ ਜਗੁ ਜੀਤੁ ॥", "a": 6, "s": 334.89, "e": 341.3, "m": "ਸਾਰਿਆਂ ਨਾਲ ਭਾਈਚਾਰੇ ਨੂੰ ਯੋਗਾਮਤ ਦਾ ਸ਼ਰੋਮਣੀ ਭੇਖ ਬਣਾ ਅਤੇ ਆਪਣੇ ਆਪ ਦੇ ਜਿੱਤਣ ਨੂੰ ਜਗਤ ਦੀ ਜਿੱਤ ਖ਼ਿਆਲ ਕਰ।"}, {"t": "ਆਦੇਸੁ; ਤਿਸੈ ਆਦੇਸੁ ॥", "a": 6, "s": 341.93, "e": 346.48, "m": "ਨਿਮਸਕਾਰ, ਮੇਰੀ ਨਿਮਸਕਾਰ ਹੈ ਉਸ ਸਾਹਿਬ ਨੂੰ।"}, {"t": "ਆਦਿ ਅਨੀਲੁ. ਅਨਾਦਿ ਅਨਾਹਤਿ; ਜੁਗੁ ਜੁਗੁ ਏਕੋ ਵੇਸੁ ॥੨੮॥", "a": 6, "s": 347.27, "e": 357.62, "m": "ਉਹ ਮੁਢਲਾ, ਪਵਿੱਤ, ਆਰੰਭ ਰਹਿਤ, ਅਵਿਨਾਸ਼ੀ ਅਤੇ ਸਮੂਹ ਯੁਗਾਂ ਅੰਦਰ ਉਸੇ ਇਕੋ ਲਿਬਾਸ ਵਾਲਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੨੯", "lines": [{"t": "ਭੁਗਤਿ ਗਿਆਨੁ, ਦਇਆ ਭੰਡਾਰਣਿ; ਘਟਿ ਘਟਿ ਵਾਜਹਿ ਨਾਦ ॥", "a": 6, "s": 358.13, "e": 368.52, "m": "ਬ੍ਰੱਹਮ ਗਿਆਤ ਨੂੰ ਆਪਣਾ ਭੋਜਨ ਅਤੇ ਰਹਿਮ ਨੂੰ ਆਪਣਾ ਮੋਦੀ ਬਣਾ ਅਤੇ ਈਸ਼ਵਰੀ ਰਾਗ ਜੋ ਹਰ ਦਿਲ ਅੰਦਰ ਹੁੰਦਾ ਹੈ, ਨੂੰ ਸਰਵਣ ਕਰ।"}, {"t": "ਆਪਿ ਨਾਥੁ, ਨਾਥੀ ਸਭ ਜਾ ਕੀ; ਰਿਧਿ ਸਿਧਿ ਅਵਰਾ ਸਾਦ ॥", "a": 6, "s": 369.59, "e": 381.4, "m": "ਉਹ ਖੁਦ ਸ਼ਰੋਮਣੀ ਸਾਹਿਬ ਹੈ ਜਿਸਨੇ ਸਾਰਿਆਂ ਨੂੰ ਨਕੇਲ ਪਾਈ ਹੋਈ ਹੈ। ਧਨਸੰਪਦਾ ਤੇ ਕਰਾਮਾਤਾਂ ਹੋਰ ਹੀ ਸੁਆਦ ਹਨ ਜੋ ਸਾਧੂਆਂ ਨਹੀਂ ਭਾਉਂਦੇ।"}, {"t": "ਸੰਜੋਗੁ ਵਿਜੋਗੁ ਦੁਇ, ਕਾਰ ਚਲਾਵਹਿ; ਲੇਖੇ ਆਵਹਿ ਭਾਗ ॥", "a": 6, "s": 382.31, "e": 393.82, "m": "ਮਿਲਾਪ ਅਤੇ ਵਿਛੋੜਾ ਦੋਨੇਂ ਸੰਸਾਰ ਦੇ ਕੰਮ ਚਲਾਉਂਦੇ ਹਨ ਅਤੇ ਪਰਾਲਭਧ ਦੁਆਰਾ ਬੰਦਾ ਆਪਣਾ ਹਿੱਸਾ ਪਰਾਪਤ ਕਰਦਾ ਹੈ।"}, {"t": "ਆਦੇਸੁ; ਤਿਸੈ ਆਦੇਸੁ ॥", "a": 7, "s": 0.77, "e": 5.38, "m": "ਨਿਮਸਕਾਰ, ਮੇਰੀ ਨਿਮਸਕਾਰ ਹੈ ਉਸ ਸਾਹਿਬ ਨੂੰ।"}, {"t": "ਆਦਿ ਅਨੀਲੁ. ਅਨਾਦਿ ਅਨਾਹਤਿ; ਜੁਗੁ ਜੁਗੁ ਏਕੋ ਵੇਸੁ ॥੨੯॥", "a": 7, "s": 6.41, "e": 17.04, "m": "ਉਹ ਮੁੱਢਲਾ, ਪਵਿਤ੍ਰ, ਆਰੰਭ-ਰਹਿਤ, ਅਵਿਨਾਸੀ ਅਤੇ ਸਮੂਹ ਯੁਗਾਂ ਅੰਦਰ ਉਸੇ ਇਕੋ ਲਿਬਾਸ ਵਾਲਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੦", "lines": [{"t": "ਏਕਾ ਮਾਈ. ਜੁਗਤਿ ਵਿਆਈ; ਤਿਨਿ ਚੇਲੇ ਪਰਵਾਣੁ ॥", "a": 7, "s": 17.73, "e": 26.36, "m": "ਅਦੁੱਤੀ ਮਾਲਕ (ਜਾਂ ਮਾਤਾ) ਨੇ ਉਤਪਤੀ ਦੀ ਵਿਉਂਤ ਰਚ ਕੇ ਤਿੰਨ ਮੰਨੇ ਮੁਰੀਦ ਅਸਥਾਪਨ ਕੀਤੇ।"}, {"t": "ਇਕੁ ਸੰਸਾਰੀ. ਇਕੁ ਭੰਡਾਰੀ; ਇਕੁ ਲਾਏ ਦੀ ਬਾਣੁ ॥", "a": 7, "s": 27.01, "e": 35.78, "m": "ਇਕ (ਬ੍ਰਹਮਾ) ਸੰਸਾਰ ਰਚਨਵਾਲਾ, ਇਕ (ਵਿਸ਼ਨੂ ਜਾਂ ਮੋਦੀ) ਰੋਜ਼ੀ ਦੇਣ ਵਾਲਾ, ਤੇ ਇਕ (ਸ਼ਿਵ) ਨੂੰ ਲਯ ਕਰਨ ਦੀ ਵਾਦੀ ਹੈ।"}, {"t": "ਜਿਵ ਤਿਸੁ ਭਾਵੈ. ਤਿਵੈ ਚਲਾਵੈ; ਜਿਵ ਹੋਵੈ ਫੁਰਮਾਣੁ ॥", "a": 7, "s": 36.09, "e": 45.96, "m": "ਜਿਸ ਤਰ੍ਹਾਂ ਉਸ ਦਾ ਹੁਕਮ ਹੈ, ਅਤੇ ਜਿਸ ਤਰ੍ਹਾਂ ਉਸ ਨੂੰ ਭਾਉਂਦਾ ਹੈ, ਤੇ ਉਹ ਉਸੇ ਤਰ੍ਹਾਂ ਉਨ੍ਹਾਂ ਨੂੰ ਟੋਰਦਾ ਹੈ।"}, {"t": "ਓਹੁ ਵੇਖੈ, ਓਨਾ ਨਦਰਿ ਨ ਆਵੈ; ਬਹੁਤਾ ਏਹੁ ਵਿਡਾਣੁ ॥", "a": 7, "s": 46.23, "e": 56.44, "m": "ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਤੱਕਦਾ ਹੈ ਪ੍ਰਤੂੰ ਉਹ ਉਸ ਨੂੰ ਨਹੀਂ ਦੇਖਦੇ। ਇਹ ਸਭ ਤੋਂ ਵੱਡੀ ਹੈਰਾਨੀ ਹੈ।"}, {"t": "ਆਦੇਸੁ; ਤਿਸੈ ਆਦੇਸੁ ॥", "a": 7, "s": 57.09, "e": 62.08, "m": "ਨਿਮਸਕਾਰ, ਮੇਰੀ ਨਿਮਸਕਾਰ ਹੈ ਉਸ ਸਾਹਿਬ ਨੂੰ।"}, {"t": "ਆਦਿ ਅਨੀਲੁ. ਅਨਾਦਿ ਅਨਾਹਤਿ; ਜੁਗੁ ਜੁਗੁ ਏਕੋ ਵੇਸੁ ॥੩੦॥", "a": 7, "s": 62.49, "e": 73.46, "m": "ਉਹ ਮੁੱਢਲਾ, ਪਵਿਤ੍ਰ, ਆਰੰਭ-ਰਹਿਤ, ਅਵਿਨਾਸ਼ੀ ਅਤੇ ਸਮੂਹ ਯੁਗਾਂ ਅੰਦਰਿ ਉਸੇ ਇਕੋ ਲਿਬਾਸ ਵਾਲਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੧", "lines": [{"t": "ਆਸਣੁ ਲੋਇ ਲੋਇ; ਭੰਡਾਰ ॥", "a": 7, "s": 74.13, "e": 79.98, "m": "ਸਾਰਿਆਂ ਸੰਸਾਰਾਂ ਅੰਦਰ ਸੁਆਮੀ ਦਾ ਟਿਕਾਣਾ ਅਤੇ ਮਾਲ ਗੁਦਾਮ ਹਨ।"}, {"t": "ਜੋ ਕਿਛੁ ਪਾਇਆ; ਸੁ ਏਕਾ ਵਾਰ ॥", "a": 7, "s": 80.39, "e": 85.9, "m": "ਜੋ ਕੁਝ ਭੀ ਉਨ੍ਹਾਂ ਵਿੱਚ ਪਾਇਆ ਗਿਆ ਸੀ, ਕੇਵਲ ਇਕੋ ਵਾਰੀ ਹੀ ਪਾਇਆ ਗਿਆ ਸੀ।"}, {"t": "ਕਰਿ ਕਰਿ ਵੇਖੈ; ਸਿਰਜਣਹਾ  2.12, "m": "ਰੂਹਾਨੀ ਉਦਮ ਦੇ ਮੰਡਲ ਦੀ ਬੋਲੀ ਸੁੰਦ੍ਰਤਾ ਹੈ।"}, {"t": "ਤਿਥੈ ਘਾੜਤਿ ਘੜੀਐ; ਬਹੁਤੁ ਅਨੂਪੁ ॥", "a": 8, "s": 2.12, "e": 7.24, "m": "ਉਥੇ ਪ੍ਰੇਮ ਲਾਸਾਨੀ ਬਣਾਵਟ ਬਣਾਈ ਜਾਂਦੀ ਹੈ।"}, {"t": "ਤਾ ਕੀਆ ਗਲਾ; ਕਥੀਆ ਨਾ ਜਾਹਿ ॥", "a": 8, "s": 7.61, "e": 13.88, "m": "ਉਸ ਥਾਂ ਦੀਆਂ ਕਾਰਵਾਈਆਂ ਬਿਆਨ ਨਹੀਂ ਕੀਤੀਆਂ ਜਾ ਸਕਦੀਆਂ।"}, {"t": "ਜੇ ਕੋ ਕਹੈ; ਪਿਛੈ ਪਛੁਤਾਇ ॥", "a": 8, "s": 14.05, "e": 19.32, "m": "ਜੇਕਰ ਕੋਈ ਜਣਾ ਬਿਆਨ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰੇ, ਉਹ ਮਗਰੋ ਪਸ਼ਚਾਤਾਪ ਕਰੇਗਾ।"}, {"t": "ਤਿਥੈ ਘੜੀਐ; ਸੁਰਤਿ ਮਤਿ ਮਨਿ ਬੁਧਿ ॥", "a": 8, "s": 20.23, "e": 27.14, "m": "ਉਥੇ ਅੰਤ੍ਰੀਵੀ ਗਿਆਤ, ਅਕਲ, ਆਤਮਾ ਅਤੇ ਸਮਝ ਸੋਚ ਨਵੇਂ ਸਿਰਿਓ ਢਾਲੇ ਜਾਂਦੇ ਹਨ।"}, {"t": "ਤਿਥੈ ਘੜੀਐ; ਸੁਰਾ ਸਿਧਾ ਕੀ ਸੁਧਿ ॥੩੬॥", "a": 8, "s": 27.51, "e": 34.14, "m": "ਉਥੇ ਪਵਿੱਤ੍ਰ ਪੁਰਸ਼ਾਂ ਅਤੇ ਕਰਾਮਾਤੀ ਬੰਦਿਆਂ ਦੀ ਖਸਲਤ (ਨਵੇਂ ਸਿਰੀਓ) ਢਾਲੀ ਜਾਂਦੀ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੭", "lines": [{"t": "ਕਰਮ ਖੰਡ ਕੀ; ਬਾਣੀ ਜੋਰੁ ॥", "a": 8, "s": 34.29, "e": 39.94, "m": "ਬਖਸ਼ਿਸ਼ ਦੇ ਮੰਡਲ ਦੇ ਬੰਦੇ ਦੀ ਬੋਲੀ ਵਿੱਚ ਰੂਹਾਨੀ ਬਲ ਹੁੰਦਾ ਹੈ।"}, {"t": "ਤਿਥੈ; ਹੋਰੁ ਨ ਕੋਈ ਹੋਰੁ ॥", "a": 8, "s": 40.13, "e": 45.38, "m": "ਹੇਠਾ ਦੱਸਿਆਂ ਹੋਇਆ ਦੇ ਬਾਝੋਂ) ਹੋਰ ਕੋਈ ਉਸ ਮੰਡਲ ਅੰਦਰ ਨਹੀਂ ਵੱਸਦਾ।"}, {"t": "ਤਿਥੈ; ਜੋਧ ਮਹਾਬਲ ਸੂਰ ॥", "a": 8, "s": 45.65, "e": 50.08, "m": "ਪ੍ਰਮ ਬਲਵਾਨ ਜੋਧੇ ਅਤੇ ਸੂਰਮੇ ਉਥੇ ਨਿਵਾਸ ਰੱਖਦੇ ਹਨ।"}, {"t": "ਤਿਨ ਮਹਿ; ਰਾਮੁ ਰਹਿਆ ਭਰਪੂਰ ॥", "a": 8, "s": 50.39, "e": 56.74, "m": "ਉਨ੍ਹਾਂ ਅੰਦਰ ਵਿਆਪਕ ਪ੍ਰਭੂ ਦਾ ਜੋਰ ਪਰੀਪੂਰਨ ਹੋਇਆ ਰਹਿੰਦਾ ਹੈ।"}, {"t": "ਤਿਥੈ; ਸੀਤੋ ਸੀਤਾ ਮਹਿਮਾ ਮਾਹਿ ॥", "a": 8, "s": 57.55, "e": 64.86, "m": "ਜੋ ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ ਸ਼ਲਾਘਾ ਅੰਦਰ ਮੁਕੰਮਲ ਤੌਰ ਤੇ ਸਿਉਂਤੇ ਹੋਏ ਹਨ, ਉਹ ਉਥੇ ਰਹਿੰਦੇ ਹਨ।"}, {"t": "ਤਾ ਕੇ ਰੂਪ; ਨ ਕਥਨੇ ਜਾਹਿ ॥", "a": 8, "s": 65.13, "e": 69.38, "m": "ਉਨ੍ਹਾਂ ਦੀ ਸੁੰਦਰਤਾ ਵਰਨਣ ਨਹੀਂ ਕੀਤੀ ਜਾ ਸਕਦੀ।"}, {"t": "ਨਾ ਓਹਿ ਮਰਹਿ; ਨ ਠਾਗੇ ਜਾਹਿ ॥", "a": 8, "s": 70.47, "e": 77.4, "m": "ਉਹ ਨਾਂ ਮਰਦੇ ਹਨ ਤੇ ਨਾਂ ਹੀ ਛਲੇ ਜਾਂਦੇ ਹਨ।"}, {"t": "ਜਿਨ ਕੈ; ਰਾਮੁ ਵਸੈ ਮਨ ਮਾਹਿ ॥", "a": 8, "s": 78.05, "e": 84.82, "m": "ਜਿਨ੍ਹਾਂ ਦੇ ਦਿਲਾਂ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ।"}, {"t": "ਤਿਥੈ ਭਗਤ ਵਸਹਿ; ਕੇ ਲੋਅ ॥", "a": 8, "s": 85.13, "e": 91.02, "m": "ਅਨੇਕਾਂ ਪੁਰੀਆਂ ਦੇ ਸਾਧੂ ਉਥੇ ਰਹਿੰਦੇ ਹਨ।"}, {"t": "ਕਰਹਿ ਅਨੰਦੁ; ਸਚਾ ਮਨਿ ਸੋਇ ॥", "a": 8, "s": 91.17, "e": 97.0, "m": "ਉਹ ਮੌਜਾਂ ਮਾਣਦੇ ਹਨ। ਉਹ ਸੱਚਾ ਸੁਆਮੀ ਉਨ੍ਹਾਂ ਦੇ ਦਿਲਾਂ ਅੰਦਰ ਹੈ।"}, {"t": "ਸਚਖੰਡਿ ਵਸੈ ਨਿਰੰਕਾਰੁ ॥", "a": 8, "s": 97.77, "e": 103.46, "m": "ਸੱਚਾਈ ਦੇ ਮੰਡਲ ਵਿੱਚ ਸ਼ਕਲ ਸੂਰਤ-ਰਹਿਤ ਸੁਆਮੀ ਨਿਵਾਸ ਰੱਖਦਾ ਹੈ।"}, {"t": "ਕਰਿ ਕਰਿ ਵੇਖੈ; ਨਦਰਿ ਨਿਹਾਲ ॥", "a": 8, "s": 103.63, "e": 109.08, "m": "ਰਚਨਾ ਨੂੰ ਰਚ ਕੇ ਵਾਹਿਗੁਰੂ ਉਸਨੂੰ ਤੱਕਦਾ ਹੈ ਜਦ ਉਹ ਜੀਵਾ ਉਤੇ ਆਪਣੀ ਦਿਆ-ਦ੍ਰਿਸ਼ਟੀ ਧਾਰਦਾ ਹੈ, ਉਹ ਉਨ੍ਹਾਂ ਨੂੰ ਖ਼ੁਸ਼ ਪ੍ਰਸੰਨ ਕਰ ਦਿੰਦਾ ਹੈ।"}, {"t": "ਤਿਥੈ ਖੰਡ ਮੰਡਲ; ਵਰਭੰਡ ॥", "a": 8, "s": 109.11, "e": 113.18, "m": "ਉਸ ਮੰਡਲ ਵਿੱਚ ਮਹਾਂਦੀਪ, ਸੰਸਾਰ ਅਤੇ ਸੂਰਜ ਬੰਧਾਨ ਹਨ।"}, {"t": "ਜੇ ਕੋ ਕਥੈ; ਤ. ਅੰਤ ਨ ਅੰਤ ॥", "a": 8, "s": 113.59, "e": 119.94, "m": "ਜੇ ਕੋਈ ਉਨ੍ਹਾ ਨੂੰ ਬਿਆਨ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰੇ ਤਾਂ ਸਮਝ ਲਵੇ ਕਿ ਉਨ੍ਹਾਂ ਦਾ ਕੋਈ ਓੜਕ ਜਾਂ ਹਦ-ਬੰਨਾਂ ਨਹੀਂ।"}, {"t": "ਤਿਥੈ ਲੋਅ ਲੋਅ; ਆਕਾਰ ॥", "a": 8, "s": 120.79, "e": 126.12, "m": "ਉਥੇ ਆਲਮਾ ਉਤੇ ਆਲਮ, ਅਤੇ ਮਖਲੂਕਾਤਾਂ ਤੇ ਮਖਲੂਕਾਤਾਂ ਹਨ।"}, {"t": "ਜਿਵ ਜਿਵ ਹੁਕਮੁ; ਤਿਵੈ ਤਿਵ ਕਾਰ ॥", "a": 8, "s": 126.67, "e": 133.5, "m": "ਜਿਸ ਤਰ੍ਹਾਂ ਦਾ ਮਾਲਕ ਦਾ ਫੁਰਮਾਨ ਹੈ, ਉਸੇ ਤਰ੍ਹਾਂ ਦੇ ਹਨ ਉਨ੍ਹਾਂ ਦੇ ਕਾਰ ਵਿਹਾਰ।"}, {"t": "ਵੇਖੈ ਵਿਗਸੈ; ਕਰਿ ਵੀਚਾਰੁ ॥", "a": 8, "s": 134.13, "e": 140.0, "m": "ਸੁਆਮੀ ਆਪਣੀ ਰਚਨਾ ਨੂੰ ਦੇਖਦਾ ਹੈ ਤੇ ਇਸ ਦਾ ਧਿਆਨ ਧਰ ਕੇ ਖੁਸ਼ ਹੁੰਦਾ ਹੈ।"}, {"t": "ਨਾਨਕ ਕਥਨਾ; ਕਰੜਾ ਸਾਰੁ ॥੩੭॥", "a": 8, "s": 140.07, "e": 145.9, "m": "ਹੇ ਨਾਨਕ! ਸੱਚਾਈ ਦੇ ਮੰਡਲ ਨੂੰ ਬਿਆਨ ਕਰਨਾ ਲੋਹੇ ਵਰਗਾ ਸਖਤ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੮", "lines": [{"t": "ਜਤੁ ਪਾਹਾਰਾ; ਧੀਰਜੁ ਸੁਨਿਆਰੁ ॥", "a": 8, "s": 146.21, "e": 153.16, "m": "ਬ੍ਰਹਿਮਚਰਜ ਨੂੰ ਆਪਣੀ ਭਠੀ, ਸਬਰ ਨੂੰ ਆਪਣਾ ਸੁਨਿਆਰਾ,"}, {"t": "ਅਹਰਣਿ ਮਤਿ; ਵੇਦੁ ਹਥੀਆਰੁ ॥", "a": 8, "s": 153.35, "e": 161.14, "m": "ਸਮਝ ਨੂੰ ਆਪਣੀ ਆਰਣ, ਬ੍ਰਹਮ ਗਿਆਨ ਨੂੰ ਆਪਣੇ ਸੰਦ,"}, {"t": "ਭਉ ਖਲਾ; ਅਗਨਿ ਤਪ ਤਾਉ ॥", "a": 8, "s": 161.67, "e": 167.86, "m": "ਰੱਬ ਦੇ ਡਰ ਨੂੰ ਆਪਣੀਆਂ ਧੋਂਕਣੀਆਂ, ਤਪੱਸਿਆ ਕਰਨ ਨੂੰ ਆਪਣੀ ਅੱਗ,"}, {"t": "ਭਾਂਡਾ ਭਾਉ; ਅੰਮ੍ਰਿਤੁ ਤਿਤੁ ਢਾਲਿ ॥", "a": 8, "s": 168.21, "e": 174.92, "m": "ਅਤੇ ਪ੍ਰਭੂ ਦੇ ਪਿਆਰ ਨੂੰ ਅਪਣਾ ਬਰਤਨ ਬਣਾ, ਜਿਸ ਅੰਦਰੋਂ ਰੱਬ ਦੇ ਨਾਮ ਦਾ ਸੁਧਾ ਰਸ ਚੋ।"}, {"t": "ਘੜੀਐ ਸਬਦੁ; ਸਚੀ ਟਕਸਾਲ ॥", "a": 8, "s": 176.05, "e": 181.9, "m": "ਇਸ ਤਰ੍ਹਾਂ ਸੱਚੀ ਸਿਕਸ਼ਾਲਾ ਅੰਦਰ ਰੱਬੀ ਕਲਾਮ ਰਚੀ ਜਾਂਦੀ ਹੈ।"}, {"t": "ਜਿਨ ਕਉ ਨਦਰਿ ਕਰਮੁ; ਤਿਨ ਕਾਰ ॥", "a": 8, "s": 182.51, "e": 188.9, "m": "ਇਹ ਉਨ੍ਹਾਂ ਦਾ ਨਿੱਤਕ੍ਰਮ ਹੈ ਜਿਨ੍ਹਾਂ ਸਕਦੇ ਹਾਂ।"}, {"t": "ਤਨੁ ਮਨੁ ਧਨੁ ਸਭੁ ਸਉਪਿ ਗੁਰ ਕਉ; ਹੁਕਮਿ ਮੰਨਿਐ ਪਾਈਐ ॥", "a": 918, "s": 82.21, "e": 93.72, "m": "ਤੁਸੀਂ ਆਪਣੀ ਦੇਹ, ਆਤਮਾਂ ਅਤੇ ਦੌਲਤ ਸਮੂਹ ਗੁਰਦੇਵ ਜੀ ਦੇ ਪਾਲਣਾ ਕਰੋ, ਇਸ ਤਰ੍ਹਾਂ ਤੁਸੀਂ ਪ੍ਰਭੂ ਨੂੰ ਪਾ ਲਓਗੇ।"}, {"t": "ਹੁਕਮੁ ਮੰਨਿਹੁ ਗੁਰੂ ਕੇਰਾ; ਗਾਵਹੁ ਸਚੀ ਬਾਣੀ ॥", "a": 918, "s": 94.97, "e": 103.8, "m": "ਤੁਸੀਂ ਗੁਰੂ ਮਹਾਰਾਜ ਦੀ ਆਗਿਆ ਮੂਹਰੇ ਸਿਰ ਨਿਵਾਓ ਅਤੇ ਸੱਚੀ ਗੁਰਬਾਣੀ ਦਾ ਗਾਇਨ ਕਰੋ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਸੁਣਹੁ ਸੰਤਹੁ; ਕਥਿਹੁ. ਅਕਥ ਕਹਾਣੀ ॥੯॥", "a": 918, "s": 104.01, "e": 113.74, "m": "ਗੁਰੂ ਜੀ ਆਪਣੇ ਹਨ, ਤੁਸੀਂ ਸ੍ਰਵਣ ਕਰੋ, ਹੇ ਸਾਧੂਓ ਤੁਸੀਂ ਸੁਆਮੀ ਦੀ ਅਕਹਿ ਵਾਰਤਾ ਨੂੰ ਵਰਨਣ ਕਰੋ।"}]}, {"name": "ਪਉੜੀ ੧੦", "lines": [{"t": "ਏ ਮਨ ਚੰਚਲਾ; ਚਤੁਰਾਈ ਕਿਨੈ. ਨ ਪਾਇਆ ॥", "a": 918, "s": 114.79, "e": 123.28, "m": "ਹੇ ਮੇਰੀ ਚੁਲਬੁਲੀ ਜਿੰਦੜੀਏ! ਕਦੇ ਭੀ ਕਿਸੇ ਨੇ ਚਾਲਾਕੀ ਰਾਹੀਂ ਪ੍ਰਭੂ ਨੂੰ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕੀਤਾ।"}, {"t": "ਚਤੁਰਾਈ. ਨ ਪਾਇਆ ਕਿਨੈ; ਤੂ ਸੁਣਿ ਮੰਨ ਮੇਰਿਆ ॥", "a": 918, "s": 123.51, "e": 133.46, "m": "ਚਲਾਕੀ ਦੁਆਰਾ ਕਿਸੇ ਨੂੰ ਵਾਹਿਗੁਰੂ ਪ੍ਰਾਪਤ ਨਹੀਂ ਹੋਇਆ ਤੂੰ ਕੰਨ ਕਰ ਹੇ ਮੇਰੀ ਜਿੰਦੇ!"}, {"t": "ਏਹ ਮਾਇਆ ਮੋਹਣੀ; ਜਿਨਿ ਏਤੁ ਭਰਮਿ ਭੁਲਾਇਆ ॥", "a": 918, "s": 133.77, "e": 143.12, "m": "ਮੋਹ ਕਰ ਲੈਣ ਵਾਲੀ ਹੈ ਇਹ ਮੋਹਣੀ, ਜਿਸ ਨੇ ਪ੍ਰਾਨੀ ਨੂੰ ਵਹਿਮ ਅੰਦਰ ਐਨਾ ਗੁਮਰਾਹ ਕੀਤਾ ਹੋਇਆ ਹੈ।"}, {"t": "ਮਾਇਆ ਤ ਮੋਹਣੀ ਤਿਨੈ ਕੀਤੀ; ਜਿਨਿ ਠਗਉਲੀ ਪਾਈਆ ॥", "a": 918, "s": 143.57, "e": 151.82, "m": "ਇਹ ਟੂਣੇਹਾਰ ਸ਼ਕਤੀ ਭੀ ਉਸੇ ਹਰੀ ਦੀ ਰਚਨਾ ਹੈ, ਜਿਸ ਨੇ ਦ੍ਰਿਸ਼ਟਮਾਨ ਗਲਤ ਫਹਿਮੀ ਖਿਲਾਰੀ ਹੈ।"}, {"t": "ਕੁਰਬਾਣੁ ਕੀਤਾ ਤਿਸੈ ਵਿਟਹੁ; ਜਿਨਿ ਮੋਹੁ ਮੀਠਾ ਲਾਇਆ ॥", "a": 918, "s": 153.07, "e": 163.68, "m": "ਮੈਂ ਆਪਣੇ ਆਪ ਨੂੰ ਉਸ ਉੱਤੋਂ ਵਾਰਨੇ ਕਰਦਾ ਹਾਂ, ਜਿਸ ਨੇ ਸੰਸਾਰੀ ਮਮਤਾ ਪ੍ਰਾਨੀਆਂ ਨੂੰ ਮਿੱਠੜੀ ਲਾਈ ਹੈ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਮਨ ਚੰਚਲ; ਚਤੁਰਾਈ ਕਿਨੈ. ਨ ਪਾਇਆ ॥੧੦॥", "a": 918, "s": 163.95, "e": 174.94, "m": "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉੱਦੇ ਹਨ। ਹੇ ਬੇਚੈਨ ਬੰਦੇ! ਕਦੇ ਭੀ ਕਿਸੇ ਨੂੰ ਚਾਲਾਕੀ ਹੁਸ਼ਿਆਰੀ ਦੁਆਰਾ ਵਹਿਗੁਰੂ ਪ੍ਰਪਾਤ ਨਹੀਂ ਹੋਇਆ।"}]}, {"name": "ਪਉੜੀ ੧੧", "lines": [{"t": "ਏ ਮਨ ਪਿਆਰਿਆ; ਤੂ ਸਦਾ ਸਚੁ ਸਮਾਲੇ ॥", "a": 918, "s": 175.89, "e": 183.9, "m": "ਹੇ ਮੇਰੀ ਪਿਆਰੀ ਜਿੰਦੜੀਏ। ਤੂੰ ਸਦੀਵ ਹੀ ਸਤਿਪਰਖ ਦਾ ਸਿਮਰਨ ਕਰ।"}, {"t": "ਏਹੁ ਕੁਟੰਬੁ. ਤੂ ਜਿ ਦੇਖਦਾ; ਚਲੈ ਨਾਹੀ. ਤੇਰੈ ਨਾਲੇ ॥", "a": 918, "s": 184.19, "e": 195.32, "m": "ਇਹ ਆਰ ਪਰਵਾਰ ਜੋ ਤੂੰ ਵੇਖਦਾ ਹੈ, ਤੇਰੇ ਨਾਲ ਨਹੀਂ ਜਾਣਾ।"}, {"t": "ਸਾਥਿ ਤੇਰੈ. ਚਲੈ ਨਾਹੀ; ਤਿਸੁ ਨਾਲਿ. ਕਿਉ ਚਿਤੁ ਲਾਈਐ ॥", "a": 918, "s": 195.53, "e": 206.92, "m": "ਜਿਸ ਨੇ ਤੇਰੇ ਨਾਲ ਨਹੀਂ ਟੁਰਨਾ, ਉਸ ਦੇ ਨਾਲ ਤੂੰ ਕਿਉਂ ਆਪਣੇ ਮਨ ਨੂੰ ਜੋੜਦਾ ਹੈਂ।"}, {"t": "ਐਸਾ ਕੰਮੁ ਮੂਲੇ. ਨ ਕੀਚੈ; ਜਿਤੁ ਅੰਤਿ ਪਛੋਤਾਈਐ ॥", "a": 918, "s": 207.49, "e": 217.24, "m": "ਐਹੋ ਜੇਹਾ ਅਮਲ ਤੂੰ ਮੂਲੋਂ ਹੀ ਨਾਂ ਕਮ ਜਿਸ ਦਾ ਤੈਨੂੰ ਅਖੀਰ ਨੂੰ ਪਸਚਾਤਾਪ ਕਰਨਾ ਪਵੇ।"}, {"t": "ਸਤਿਗੁਰੂ ਕਾ ਉਪਦੇਸੁ ਸੁਣਿ ਤੂ; ਹੋਵੈ ਤੇਰੈ ਨਾਲੇ ॥", "a": 918, "s": 217.59, "e": 227.9, "m": "ਤੂੰ ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਸਿੱਖਿਆ ਸ੍ਰਵਣ ਕਰ ਜੋ ਕਿ ਤੇਰੇ ਨਾਲ ਜਾਊਗੀ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਮਨ ਪਿਆਰੇ; ਤੂ ਸਦਾ ਸਚੁ ਸਮਾਲੇ ॥੧੧॥", "a": 918, "s": 228.13, "e": 238.5, "m": "ਗੁਰੂ ਜੀ ਫ਼ੁਰਮਾਉਂਦੇ ਹਨ, ਹੇ ਮੇਰੇ ਪ੍ਰੀਤਵਾਨ ਪ੍ਰਾਨੀ। ਤੂੰ ਹਮੇਸ਼ਾਂ ਹੀ ਸੱਚੇ ਸੁਆਮੀ ਦਾ ਆਰਾਧਨ ਕਰ।"}]}, {"name": "ਪਉੜੀ ੧੨", "lines": [{"t": "ਅਗਮ ਅਗੋਚਰਾ; ਤੇਰਾ ਅੰਤੁ. ਨ ਪਾਇਆ ॥", "a": 918, "s": 238.77, "e": 246.68, "m": "ਹੇ ਮੇਰੇ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਅਤੇ ਸਮਝ ਸੋਚ ਤੋਂ ਉਚੇਰੇ ਸਾਈਂ! ਤੇਰਾ ਓੜਕ ਜਾਣਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"}, {"t": "ਅੰਤੋ. ਨ ਪਾਇਆ ਕਿਨੈ ਤੇਰਾ; ਆਪਣਾ ਆਪੁ ਤੂ ਜਾਣਹੇ ॥", "a": 918, "s": 247.09, "e": 258.78, "m": "ਕਿਸੇ ਨੂੰ ਭੀ ਤੇਰੇ ਅਖੀਰ ਦਾ ਪਤਾ ਨਹੀਂ ਲੱਗਾ। ਕੇਵਲ ਤੂੰ ਹੀ ਆਪਣੇ ਆਪ ਨੂੰ ਜਾਣਦਾ ਹੈ।"}, {"t": "ਜੀਅ ਜੰਤ ਸਭਿ ਖੇਲੁ ਤੇਰਾ; ਕਿਆ ਕੋ ਆਖਿ ਵਖਾਣਏ ॥", "a": 918, "s": 259.15, "e": 269.86, "m": "ਇਨਸਾਨ ਅਤੇ ਹੋਰ ਪਸ਼ੂ ਪੰਛੀ ਸਮੂਹ ਤੈਂ ਡੀਆਂ ਹੀ ਖੇਡਾਂ ਹਨ। ਕਿਹੜਿਆ ਸ਼ਬਦਾਂ ਦੁਆਰਾ ਕੋਈ ਜਣਾ ਤੈਨੂੰ ਵਰਨਣ ਅਤੇ ਬਿਆਨ ਕਰ ਸਕਦਾ ਹੈ।"}, {"t": "ਆਖਹਿ ਤ ਵੇਖਹਿ ਸਭੁ ਤੂਹੈ; ਜਿਨਿ ਜਗਤੁ ਉਪਾਇਆ ॥", "a": 918, "s": 270.65, "e": 279.92, "m": "ਤੂੰ ਹੀ ਹੈ ਜਿਸ ਨੇ ਸੰਸਾਰ ਨੂੰ ਰਚਿਆ ਹੈ ਅਤੇ ਜੋ ਬੋਲਦਾ ਅਤੇ ਸਾਰਿਆਂ ਨੂੰ ਦੇਖਦਾ ਹੈ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਤੂ ਸਦਾ ਅਗੰਮੁ ਹੈ; ਤੇਰਾ ਅੰਤੁ ਨ ਪਾਇਆ ॥੧੨॥", "a": 918, "s": 280.51, "e": 291.88, "m": "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਤੂੰ, ਹੇ ਸੁਆਮੀ। ਸਦੀਵ ਹੀ ਪਹੁੰਚ ਤੋਂ ਪਰੇ ਹੈਂ। ਤੇਰਾ ਓੜਕ ਲੱਭਿਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"}]}, {"name": "ਪਉੜੀ ੧੩", "lines": [{"t": "ਸੁਰਿ ਨਰ ਮੁਨਿ ਜਨ. ਅੰਮ੍ਰਿਤੁ ਖੋਜਦੇ; ਸੁ ਅੰਮ੍ਰਿਤੁ. ਗੁਰ ਤੇ ਪਾਇਆ ॥", "a": 918, "s": 292.45, "e": 306.02, "m": "ਦੈਵੀ ਪਰਸ਼ ਅਤੇ ਖਾਮੋਸ਼ ਰਿਸ਼ੀ ਈਸ਼ਵਰੀ ਅੰਮ੍ਰਿਤ ਦੀ ਢੂੰਡ ਭਾਲ ਕਰਦੇ ਹਨ। ਉਹ ਆਬਿ-ਹਿਯਾਤ ਮੈਨੂੰ ਗੁਰਾਂ ਪਾਸੋਂ ਪ੍ਰਾਪਤ ਹੋ ਗਿਆ ਹੈ।"}, {"t": "ਪਾਇਆ ਅੰਮ੍ਰਿਤੁ. ਗੁਰਿ ਕ੍ਰਿਪਾ ਕੀਨੀ; ਸਚਾ ਮਨਿ ਵਸਾਇਆ ॥", "a": 918, "s": 306.81, "e": 316.62, "m": "ਜਿਸ ਉੱਤੇ ਗੁਰੂ ਜੀ ਦਇਆ ਕਰਦੇ ਹਨ, ਉਹ ਆਬਿ-ਹਿਯਾਤ ਨੂੰ ਪਾ ਲੈਂਦਾ "t": "ਏਹੁ ਧਨੁ ਤਿਨਾ ਮਿਲਿਆ; ਜਿਨ ਹਰਿ ਆਪੇ ਭਾਣਾ ॥", "a": 921, "s": 181.77, "e": 191.3, "m": "ਜੋ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਨੂੰ ਚੰਗੇ ਲਗਦੇ ਹਨ, ਇਹ ਦੌਲਤ ਉਨ੍ਹਾਂ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦੀ ਹੈ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਹਰਿ ਰਾਸਿ ਮੇਰੀ; ਮਨੁ ਹੋਆ ਵਣਜਾਰਾ ॥੩੧॥", "a": 921, "s": 191.51, "e": 203.46, "m": "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਵਾਹਿਗੁਰੂ ਮੇਰਾ ਸੁਦਾਗਰੀ ਦਾ ਮਾਨ ਹੈ ਅਤੇ ਮੇਰੀ ਆਤਮਾ ਸੁਦਾਗਰ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੨", "lines": [{"t": "ਏ ਰਸਨਾ. ਤੂ ਅਨ ਰਸਿ ਰਾਚਿ ਰਹੀ; ਤੇਰੀ ਪਿਆਸ. ਨ ਜਾਇ ॥", "a": 921, "s": 204.35, "e": 216.9, "m": "ਹੇ ਮੇਰੀ ਜੀਭ੍ਹੇ। ਤੂੰ ਹੋਰਨਾਂ ਸੁਆਦਾਂ ਅੰਦਰ ਖੱਚਤ ਹੋ ਰਹੀ ਹੈਂ, ਤੇਰੀ ਤੇਹ ਬੁੱਝਦੀ ਨਹੀਂ।"}, {"t": "ਪਿਆਸ. ਨ ਜਾਇ ਹੋਰਤੁ ਕਿਤੈ; ਜਿਚਰੁ ਹਰਿ ਰਸੁ ਪਲੈ. ਨ ਪਾਇ ॥", "a": 921, "s": 217.41, "e": 229.78, "m": "ਤੇਰੀ ਤੇਹ ਕਿਸੇ ਹੋਰਸ ਜ਼ਰੀਏ ਨਾਲ ਨਹੀਂ ਬੁਝਣੀ, ਜਦ ਤਾਂਈਂ ਤੂੰ ਪ੍ਰਭੂ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪ੍ਰਾਪਤ ਨਹੀਂ ਕਰਦੀ।"}, {"t": "ਹਰਿ ਰਸੁ ਪਾਇ ਪਲੈ. ਪੀਐ ਹਰਿ ਰਸੁ; ਬਹੁੜਿ ਨ ਤ੍ਰਿਸਨਾ ਲਾਗੈ ਆਇ ॥", "a": 921, "s": 230.25, "e": 244.56, "m": "ਜੇਕਰ ਤੂੰ ਸੁਆਮੀ ਦੇ ਅੰਮ੍ਰਿਤ ਨੂੰ ਪਾ ਲਵੇ ਅਤੇ ਸੁਆਮੀ ਦੇ ਅੰਮਿਤ ਨੂੰ ਪਾਨ ਕਰ ਲਵੇਂ ਤਾਂ ਤੈਨੂੰ ਮੁੜ ਕੇ ਤੇਹ ਨਹੀਂ ਲੱਗੇਗੀ।"}, {"t": "ਏਹੁ ਹਰਿ ਰਸੁ. ਕਰਮੀ ਪਾਈਐ; ਸਤਿਗੁਰੁ ਮਿਲੈ ਜਿਸੁ ਆਇ ॥", "a": 921, "s": 245.39, "e": 256.2, "m": "ਹਰੀ ਦੀ ਦਇਆ ਦੁਆਰਾ, ਵਹਿਗੁਰੂ ਦਾ ਇਹ ਅੰਮ੍ਰਿਤ ਉਸ ਨੂੰ ਪ੍ਰਾਪਤ ਹੁੰਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਸੱਚੇ ਗੁਰੂ ਜੀ ਆ ਕੇ ਮਿਲ ਪੈਂਦੇ ਹਨ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਹੋਰਿ ਅਨ ਰਸ ਸਭਿ ਵੀਸਰੇ; ਜਾ ਹਰਿ ਵਸੈ ਮਨਿ ਆਇ ॥੩੨॥", "a": 921, "s": 256.73, "e": 271.24, "m": "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਜਦ ਸਾਈਂ ਆ ਕੇ ਮਨੁਸ਼ ਦੇ ਚਿੱਤ ਵਿੱਚ ਵੱਸ ਜਾਂਦਾ ਹੈ, ਤਾਂ ਉਹ ਹੋਰ ਸਾਰੇ ਸੁਆਦਾਂ ਨੂੰ ਭੁਲ ਜਾਂਦਾ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੩", "lines": [{"t": "ਏ ਸਰੀਰਾ ਮੇਰਿਆ. ਹਰਿ ਤੁਮ ਮਹਿ ਜੋਤਿ ਰਖੀ; ਤਾ ਤੂ. ਜਗ ਮਹਿ ਆਇਆ ॥", "a": 921, "s": 272.51, "e": 288.54, "m": "ਹੇ ਮੇਰੀ ਦੇਹ, ਵਾਹਿਗੁਰੂ ਨੇ ਤੇਰੇ ਵਿੱਚ ਆਪਣਾ ਪ੍ਰਕਾਸ਼ ਟਿਕਾਇਆ ਤੇ ਤਦ ਤੂੰ ਇਸ ਜਹਾਨ ਵਿੱਚ ਆਈ।"}, {"t": "ਹਰਿ ਜੋਤਿ ਰਖੀ. ਤੁਧੁ ਵਿਚਿ; ਤਾ ਤੂ ਜਗ ਮਹਿ ਆਇਆ ॥", "a": 921, "s": 289.19, "e": 299.86, "m": "ਪ੍ਰਭੂ ਨੇ ਆਪਣਾ ਪ੍ਰਕਾਸ਼ ਤੇਰੇ ਅੰਦਰ ਟਿਕਾ ਦਿੱਤਾ ਅਤੇ ਤਦ ਤੂੰ ਇਸ ਸੰਸਾਰ ਵਿੱਚ ਆਈ।"}, {"t": "ਹਰਿ ਆਪੇ ਮਾਤਾ. ਆਪੇ ਪਿਤਾ; ਜਿਨਿ ਜੀਉ ਉਪਾਇ. ਜਗਤੁ ਦਿਖਾਇਆ ॥", "a": 921, "s": 300.73, "e": 314.74, "m": "ਵਾਹਿਗੁਰੂ ਆਪੇ ਮਾਂ ਹੈ ਅਤੇ ਆਪੇ ਹੀ ਪਿਉ ਜਿਸ ਨੇ ਇਨਸਾਨ ਨੂੰ ਪੈਦਾ ਕਰ ਕੇ ਉਸ ਨੂੰ ਸੰਸਾਰ ਵਿਖਾਲਿਆ ਹੈ।"}, {"t": "ਗੁਰਪਰਸਾਦੀ ਬੁਝਿਆ. ਤਾ ਚਲਤੁ ਹੋਆ; ਚਲਤੁ ਨਦਰੀ ਆਇਆ ॥", "a": 921, "s": 315.75, "e": 327.66, "m": "ਜਦ ਇਨਸਾਨ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਅਸਲੀਅਤ ਨੂੰ ਅਨੁਭਗ ਕਰ ਲੈਂਦਾ ਹੈ, ਤਦ ਉਸ ਲਈ ਇਹ ਦੁਨੀਆ ਇੱਕ ਤਮਾਸ਼ਾ ਹੈ ਅਤੇ ਕੇਵਲ ਤਮਾਸ਼ਾ ਹੀ ਦਿਸਦੀ ਹੈ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਸ੍ਰਿਸਟਿ ਕਾ ਮੂਲੁ ਰਚਿਆ. ਜੋਤਿ ਰਾਖੀ; ਤਾ ਤੂ ਜਗ ਮਹਿ ਆਇਆ ॥੩੩॥", "a": 921, "s": 328.37, "e": 346.02, "m": "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ ਪ੍ਰਭੂ ਨੇ ਸ਼੍ਰਿਸ਼ਟੀ ਦੀ ਨੀਂਹ ਰੱਖੀ, ਤੇਰੀ ਦੇਹ ਅੰਦਰ ਆਪਣਾ ਨੂਰ ਭਰਿਆ ਅਤੇ ਤਦ ਤੂੰ ਜਹਾਨ ਅੰਦਰ ਹਾਇਆ।"}]}, {"name": "ਪਉੜੀ ੩੪", "lines": [{"t": "ਮਨਿ ਚਾਉ ਭਇਆ; ਪ੍ਰਭ ਆਗਮੁ ਸੁਣਿਆ ॥", "a": 921, "s": 346.69, "e": 354.12, "m": "ਆਪਣੇ ਸੁਆਮੀ ਦਾ ਆਉਣਾ ਸੁਣ ਕੇ ਮੇਰੀ ਜਿੰਦੜੀ ਪਰਮ ਖੁਸ਼ੀ ਅੰਦਰ ਹੈ।"}, {"t": "ਹਰਿ ਮੰਗਲੁ ਗਾਉ ਸਖੀ; ਗ੍ਰਿਹੁ ਮੰਦਰੁ ਬਣਿਆ ॥", "a": 921, "s": 354.73, "e": 363.82, "m": "ਤੁਸੀਂ ਮੇਰੇ ਸੁਆਮੀ ਦੀ ਆਉਭਗਤ ਅੰਦਰ ਖੁਸ਼ੀ ਦੇ ਗੀਤ ਗਾਇਨ ਕਰੋ, ਹੇ ਮੇਰੀਓ ਸਹੇਲੀਓ। ਮੇਰਾ ਘਰ ਹੁਣ ਮੇਰੇ ਸੁਆਮੀ ਦਾ ਮਹਿਲ ਬਣ ਗਿਆ ਹੈ,"}, {"t": "ਹਰਿ ਗਾਉ ਮੰਗਲੁ ਨਿਤ ਸਖੀਏ; ਸੋਗੁ ਦੂਖੁ. ਨ ਵਿਆਪਏ ॥", "a": 921, "s": 364.31, "e": 375.94, "m": "ਤੁਸੀਂ ਸਦਾ ਵਹਿਗੁਰੂ ਲਈ, ਜੀ ਆਇਆਂ ਦੇ ਗੀਤ ਗਾਓ ਹੇ ਸਹੇਲੀਓ! ਤੇ ਤੁਹਾਨੂੰ ਗਮ ਅਤੇ ਕਲੇਸ਼ ਨਹੀਂ ਚਿਮੜਨਗੇ।"}, {"t": "ਗੁਰ ਚਰਨ ਲਾਗੇ. ਦਿਨ ਸਭਾਗੇ; ਆਪਣਾ ਪਿਰੁ ਜਾਪਏ ॥", "a": 921, "s": 376.01, "e": 386.3, "m": "ਭਾਰੇ ਭਾਗਾਂ ਵਾਲਾ ਹੈ ਉਹ ਦਿਹਾੜਾ, ਜਦ ਮੈਂ ਗੁਰਾਂ ਦੇ ਚਰਨਾ ਨਾਲ ਜੁੜਦਾ ਅਤੇ ਆਪਣੇ ਪ੍ਰੀਤਮ ਨੂੰ ਸਿਮਰਦਾ ਹਾਂ।"}, {"t": "ਅਨਹਤ ਬਾਣੀ. ਗੁਰਸਬਦਿ ਜਾਣੀ; ਹਰਿ ਨਾਮੁ ਹਰਿ ਰਸੁ ਭੋਗੋ ॥", "a": 921, "s": 386.33, "e": 398.22, "m": "ਗੁਰਾਂ ਦੇ ਉਪਦੇਸ਼ ਦੁਆਰਾ, ਮੈਂ ਸੁਤੇ ਸਿੱਧ ਹੋਣ ਵਾਲੇ ਰਾਗ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲਿਆ ਹੈ ਅਤੇ ਰੱਬ ਦੇ ਨਾਮ ਦੇ ਈਸ਼ਵਰੀ ਸੁਆਦ ਨੂੰ ਮਾਣਦਾ ਹਾਂ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਪ੍ਰਭੁ ਆਪਿ ਮਿਲਿਆ; ਕਰਣ ਕਾਰਣ ਜੋਗੋ ॥੩੪॥", "a": 922, "s": 0.17, "e": 11.88, "m": "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਸੁਆਮੀ ਖ਼ੁਦ, ਜੋ ਸਾਰੇ ਕੰਮ ਕਰਨ ਨੂੰ ਸਮਰਥ ਹੈ, ਮੈਨੂੰ ਮਿਲ ਪਿਆ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੫", "lines": [{"t": "ਏ ਸਰੀਰਾ ਮੇਰਿਆ. ਇਸੁ ਜਗ ਮਹਿ ਆਇ ਕੈ; ਕਿਆ ਤੁਧੁ ਕਰਮ ਕਮਾਇਆ ॥", "a": 922, "s": 13.09, "e": 27.8, "m": "ਹੇ ਮੇਰੀ ਦੇਹ, ਇਸ ਸੰਸਾਰ ਵਿੱਚ ਆ ਕੇ ਤੂੰ ਕਿਹੜਾ ਕੰਮ ਕੀਤਾ ਹੈ?"}, {"t": "ਕਿ ਕਰਮ ਕਮਾਇਆ. ਤੁਧੁ ਸਰੀਰਾ; ਜਾ ਤੂ. ਜਗ ਮਹਿ ਆਇਆ ॥", "a": 922, "s": 28.67, "e": 41.14, "m": "ਤੂੰ ਕਿਹੜਾ ਕੰਮ ਕੀਤਾ ਹੈ ਹੇ ਮੈਡੀ ਦੇਹ! ਜਦ ਦੀ ਤੂੰ ਇਸ ਜਹਾਨ ਅੰਦਰ ਆਈ ਹੈਂ?"}, {"t": "ਜਿਨਿ ਹਰਿ ਤੇਰਾ ਰਚਨੁ ਰਚਿਆ; ਸੋ ਹਰਿ ਮਨਿ. ਨ ਵਸਾਇਆ ॥", "a": 922, "s": 41.97, "e": 53.9, "m": "ਉਹ ਸਾਹਿਬ ਜਿਸ ਨੇ ਤੇਰੀ ਬਨਾਵਟ ਬਣਾਈ ਹੈ, ਉਸ ਸਾਈਂ ਨੂੰ ਤੂੰ ਆਪਣੇ ਹਿਰਦੇ ਅੰਦਰ ਨਹੀਂ ਟਿਕਾਇਆ।"}, {"t": "ਗੁਰਪਰਸਾਦੀ ਹਰਿ ਮੰਨਿ ਵਸਿਆ; ਪੂਰਬਿ ਲਿਖਿਆ ਪਾਇਆ ॥", "a": 922, "s": 54.71, "e": 66.24, "m": "ਗੁਰਾਂ ਦੀ ਮਿਹਰ ਦੁਆਰਾ ਸਾਹਿਬ ਮੇਰੇ ਚਿੱਤ ਵਿੱਚ ਟਿੱਕ ਜਾਂਦਾ ਹੈ ਅਤੇ ਜੋ ਕੁਛ ਮੇਰੇ ਲਈ ਮੁੱਢ ਤੋਂ ਲਿਖਿਆ ਹੋਇਆ ਹੈ, ਮੈਂ ਉਸ ਨੂੰ ਪਾ ਲੈਂਦਾ ਹਾਂ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਏਹੁ ਸਰੀਰੁ ਪਰਵਾਣੁ ਹੋਆ; ਜਿਨਿ ਸਤਿਗੁਰ ਸਿਉ ਚਿਤੁ ਲਾਇਆ ॥੩੫॥", "a": 922, "s": 66.81, "e": 82.9, "m": "ਗੁਰੂ ਜੀ ਆਖਦੇ ਹਨ, ਉਸ ਦੀ ਇਹ ਦੇਹ, ਜੋ ਆਪਣੇ ਮਨ ਨੂੰ ਸੱਚੇ ਗੁਰਾਂ ਨਾਲ ਜੋੜਦਾ ਹੈ, ਕਬੂਲ ਪੈ ਵੰਝਦੀ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੬", "lines": [{"t": "ਏ ਨੇਤ੍ਰਹੁ ਮੇਰਿਹੋ. ਹਰਿ ਤੁਮ ਮਹਿ ਜੋਤਿ ਧਰੀ; ਹਰਿ ਬਿਨੁ ਅਵਰੁ. ਨ ਦੇਖਹੁ ਕੋਈ ॥", "a": 922, "s": 84.35, "e": 100.9, "m": "ਹੇ ਮੇਰੀਓ ਅੱਖੋ! ਵਾਹਿਗੁਰੂ ਨੇ ਤੁਹਾਡੇ ਵਿੱਚ ਨੂਰ ਟਿਕਾਇਆ ਹੈ ਇਸ ਲਈ ਪ੍ਰਭੂ ਦੇ ਬਗੈਰ ਤੁਸੀਂ ਹੋਰ ਕਿਸੇ ਨੂੰ ਨਾਂ ਵੇਖੋ।"}, {"t": "ਹਰਿ ਬਿਨੁ ਅਵਰੁ. ਨ ਦੇਖਹੁ ਕੋਈ; ਨਦਰੀ ਹਰਿ ਨਿਹਾਲਿਆ ॥", "a": 922, "s": 101.11, "e": 111.66, "m": "ਸੁਆਮੀ ਦੇ ਬਾਝੋਂ ਤੁਸੀਂ ਹੋਰ ਕਿਸੇ ਨੂੰ ਨਾਂ ਵੇਖੋ ਕੇਵਲ ਮਿਹਰਬਾਨ ਮਾਲਕ ਸੁਆਮੀ ਹੀ ਵੇਖਣ ਦੇ ਯੋਗ ਹੈ।"}, {"t": "ਏਹੁ ਵਿਸੁ ਸੰਸਾਰੁ. ਤੁਮ ਦੇਖਦੇ. ਏਹੁ ਹਰਿ ਕਾ ਰੂਪੁ ਹੈ; ਹਰਿ ਰੂਪੁ ਨਦਰੀ ਆਇਆ ॥", "a": 922, "s": 112.27, "e": 128.82, "m": "ਇਹ ਸਾਰਾ ਜਗਤ ਜਿਹੜਾ ਤੁਸੀਂ ਵੇਖਦੇ ਹੋ, ਸਾਈਂ ਦਾ ਸਰੂਪ ਹੈ, ਕੇਵਲ ਵਾਹਿਗੁਰੂ ਦੀ ਤਸਵੀਰ ਹੀ ਇਸ ਵਿੱਚ ਦਿੱਸ ਆਉਂਦੀ ਹੈ।"}, {"t": "ਗੁਰਪਰਸਾਦੀ ਬੁਝਿਆ. ਜਾ ਵੇਖਾ ਹਰਿ ਇਕੁ ਹੈ; ਹਰਿ ਬਿਨੁ ਅਵਰੁ. ਨ ਕੋਈ ॥", "a": 922, "s": 129.51, "e": 144.24, "m": "ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਜਦ ਮੈਂ ਅਸਲੀਅਤ ਨੂੰ ਅਨੁਭਵ ਕਰ ਲੈਂਦਾ ਹਾਂ ਮੈਂ ਕੇਵਲ ਇੱਕ ਹਰੀ ਨੂੰ ਹੀ ਵੇਖਦਾ ਹਾਂ। ਪ੍ਰਭੂ ਦੇ ਬਾਝੋਂ ਹੋਰ ਕੋਈ ਹੈ ਹੀ ਨਹੀਂ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਏਹਿ ਨੇਤ੍ਰ ਅੰਧ ਸੇ; ਸਤਿਗੁਰਿ ਮਿਲਿਐ. ਦਿਬ ਦ੍ਰਿਸਟਿ ਹੋਈ ॥੩੬॥", "a": 922, "s": 144.47, "e": 160.18, "m": "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਇਹ ਅੱਖਾਂ ਅੰਨ੍ਹੀਆਂ ਸਨ, ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਮਿਲ ਪੈਣ ਉੱਤੇ ਇਹ ਸਾਰਾ ਕੁੱਛ ਵੇਖਣ ਵਾਲੀਆਂ ਹੋ ਗਈਆਂ ਹਨ।"}]}, {"name": "ਪਉੜੀ ੩੭", "lines": [{"t": "ਏ ਸ੍ਰਵਣਹੁ ਮੇਰਿਹੋ; ਸਾਚੈ ਸੁਨਣੈ ਨੋ ਪਠਾਏ ॥", "a": 922, "s": 160.81, "e": 169.58, "m": "ਹੇ ਮੇਰਿਓ ਕੰਨੋ! ਤੁਹਾਨੂੰ ਸਤਿਨਾਮ ਸੁਣਨ ਲਈ ਭੇਜਿਆ ਗਿਆ ਹੈ।"}, {"t": "ਸਾਚੈ ਸੁਨਣੈ ਨੋ ਪਠਾਏ. ਸਰੀਰਿ ਲਾਏ; ਸੁਣਹੁ ਸਤਿ ਬਾਣੀ ॥", "a": 922, "s": 169.77, "e": 180.86, "m": "ਤੁਹਾਨੂੰ ਸਤਿਨਾਮ ਸ੍ਰਵਣ ਕਰਨ ਲਈ ਭੇਜਿਆ ਅਤੇ ਦੇਹ ਨਾਲ ਲਾਇਆ ਗਿਆ ਹੈ। ਤੁਸੀਂ ਸੱਚੀ ਗੁਰਬਾਣੀ ਸ੍ਰਵਣ ਕਰੋ।"}, {"t": "ਜਿਤੁ ਸੁਣੀ. ਮਨੁ ਤਨੁ ਹਰਿਆ ਹੋਆ; ਰਸਨਾ ਰਸਿ ਸਮਾਣੀ ॥", "a": 922, "s": 181.17, "e": 192.2, "m": "ਜਿਸ ਨੂੰ ਸੁਣਨ ਦੁਆਰਾ ਆਤਮਾ ਦਤੇ ਦੇਹ ਸੁਰਜੀਤ ਜੋ ਜਾਂਦੇ ਹਨ ਅਤੇ ਜੀਭ੍ਹਾ ਨਾਮ-ਅੰਮ੍ਰਿਤ ਵਿੱਚ ਲੀਨ ਹੋ ਜਾਂਦੀ ਹੈ।"}, {"t": "ਸਚੁ ਅਲਖ ਵਿਡਾਣੀ; ਤਾ ਕੀ ਗਤਿ ਕਹੀ. ਨ ਜਾਏ ॥", "a": 922, "s": 192.41, "e": 202.2, "m": "ਸੱਚਾ ਸੁਆਮੀ ਅਦ੍ਰਿਸ਼ਟ ਅਤੇ ਅਸਚਰਜ ਹੈ। ਉਸ ਦੀ ਅਵਸਥਾ ਆਖੀ ਨਹੀਂ ਜਾ ਸਕਦੀ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਅੰਮ੍ਰਿਤ ਨਾਮੁ ਸੁਣਹੁ. ਪਵਿਤ੍ਰ ਹੋਵਹੁ; ਸਾਚੈ ਸੁਨਣੈ ਨੋ ਪਠਾਏ ॥੩੭॥", "a": 922, "s": 202.41, "e": 218.38, "m": "ਗੁਰੂ ਜੀ ਫ਼ੁਰਮਾਉਂਦੇ ਹਨ, ਤੁਸੀਂ ਅੰਮ੍ਰਿਤ ਨਾਮ ਨੂੰ ਸ੍ਰਵਣ ਕਰੋ ਅਤੇ ਪੁਨੀਤ ਹੋ ਜਾਓ। ਤੁਹਾਨੂੰ ਹੇ ਕੰਨੋ! ਸੱਚਾ ਨਾਮ ਸੁਣਨ ਲਈ ਭੇਜਿਆ ਗਿਆ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੮", "lines": [{"t": "ਹਰਿ ਜੀਉ. ਗੁਫਾ ਅੰਦਰਿ ਰਖਿ ਕੈ; ਵਾਜਾ ਪਵਣੁ ਵਜਾਇਆ ॥", "a": 922, "s": 218.61, "e": 229.78, "m": "ਜਿੰਦੜੀ ਨੂੰ ਸਰੀਰ ਦੀ ਕੰਦਰਾ ਵਿੱਚ ਟਿਕਾ ਕੇ ਸੁਆਮੀ ਨੇ ਸੁਆਸਾਂ ਦਾ ਸੰਗੀਤਕ ਸਾਜ਼ ਵਜਾਉਣਾ ਅਰੰਭ ਕਰ ਦਿੱਤਾ।"}, {"t": "ਵਜਾਇਆ ਵਾਜਾ ਪਉਣ. ਨਉ ਦੁਆਰੇ ਪਰਗਟੁ ਕੀਏ; ਦਸਵਾ ਗੁਪਤੁ ਰਖਾਇਆ ॥", "a": 922, "s": 230.11, "e": 243.52, "m": "ਉਸ ਨੇ ਸੁਆਸਾਂ ਦਾ ਸੰਗੀਤਕ ਸਾਜ਼ ਵਜਾਇਆ। ਨੌਂ ਦਰਵਾਜੇ ਉਸ ਨੇ ਪ੍ਰਤੱਖ ਕਰ ਦਿਤੇ ਹਨ ਤੇ ਦਸਵੇਂ ਨੂੰ ਉਸ ਨੇ ਛੁਪਾ ਰੱਖਿਆ ਹੈ।"}, {"t": "ਗੁਰ ਦੁਆਰੈ ਲਾਇ ਭਾਵਨੀ; ਇਕਨਾ ਦਸਵਾਦੁਆਰੁ ਦਿਖਾਇਆ ॥", "a": 922, "s": 244.09, "e": 254.36, "m": "ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਕਈਆਂ ਨੂੰ ਸ਼ਰਧਾ ਪ੍ਰਦਾਨ ਕਰਕੇ ਉਹ ਦਸਵਾਂ ਦੁਆਰ ਵਿਖਾਲ ਦਿੰਦਾ ਹੈ।"}, {"t": "ਤਹ ਅਨੇਕ ਰੂਪ ਨਾਉ ਨਵਨਿਧਿ; ਤਿਸ ਦਾ ਅੰਤੁ. ਨ ਜਾਈ ਪਾਇਆ ॥", "a": 922, "s": 254.99, "e": 268.14, "m": "ਅਨੇਕਾਂ ਸਰੂਪਾਂ ਵਾਲਾ ਸੁਆਮੀ ਅਤੇ ਨਾਮ ਦੇ ਨੌ ਖ਼ਜ਼ਾਨੇ ਉੱਥੇ ਹਨ। ਉਸ ਦਾ ਓੜਕ ਪਾਇਆ ਨਹੀਂ ਜਾ ਸਕਦਾ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਹਰਿ ਪਿਆਰੈ ਜੀਉ. ਗੁਫਾ ਅੰਦਰਿ ਰਖਿ ਕੈ; ਵਾਜਾ ਪਵਣੁ ਵਜਾਇਆ ॥੩੮॥", "a": 922, "s": 268.69, "e": 284.92, "m": "ਗੁਰੂ ਜੀ ਫ਼ੁਰਮਾਉਂਦੇ ਹਨ, ਆਤਮਾ ਨੂੰ ਦੇਹ ਦੀ ਕੰਦਰਾ ਵਿੱਚ ਟਿਕਾ ਕੇ ਪ੍ਰੀਤਵਾਨ ਪ੍ਰਭੂ ਨੇ ਸੁਆਸਾਂ ਨੂੰ ਸੰਗੀਤਕ ਸਾਜ਼ ਵਜੋਂ ਵਜਾਇਆ ਹੈ।"}]}, {"name": "ਪਉੜੀ ੩੯", "lines": [{"t": "ਏਹੁ ਸਾਚਾ ਸੋਹਿਲਾ; ਸਾਚੈ ਘਰਿ ਗਾਵਹੁ ॥", "a": 922, "s": 286.03, "e": 293.94, "m": "ਤੂੰ ਸੁਆਮੀ ਦੀ ਸਿਫ਼ਤ-ਸਲਾਹ ਦੇ ਇਸ ਸੱਚੇ ਗੀਤ ਨੂੰ ਆਪਣੀ ਆਤਮਾ ਦੇ ਸੱਚੇ ਘਰ ਅੰਦਰ ਗਾਇਨ ਕਰ।"}, {"t": "ਗਾਵਹੁ ਤ ਸੋਹਿਲਾ ਘਰਿ ਸਾਚੈ; ਜਿਥੈ ਸਦਾ ਸਚੁ ਧਿਆਵਹੇ ॥", "a": 922, "s": 294.21, "e": 306.08, "m": "ਸੱਚੇ ਘਰ (ਅਵਸਥਾ) ਅੰਦਰ ਜਿਥੇ ਸੰਤ ਸਦੀਵ ਹੀ ਸੱਚੇ ਸੁਆਮੀ ਨੂੰ ਸਿਮਰਦੇ ਹਨ, ਤੂੰ ਵਾਹਿਗੁਰੂ ਦੇ ਜੱਸ ਦਾ ਗਤੀ ਗਾਇਨ ਕਰ।"}, {"t": "ਸਚੋ ਧਿਆਵਹਿ ਜਾ ਤੁਧੁ ਭਾਵਹਿ; ਗੁਰਮੁਖਿ ਜਿਨਾ ਬੁਝਾਵਹੇ ॥", "a": 922, "s": 306.51, "e": 317.96, "m": "ਜਦ ਉਹ ਤੈਨੂੰ ਚੰਗੇ ਲਗਦੇ ਹਨ ਅਤੇ ਗੁਰਾਂ ਦੇ ਰਾਹੀਂ ਜਿਨ੍ਹਾਂ ਨੂੰ ਤੂੰ ਸਮਝ ਬਖ਼ਸਦਾ ਹੈਂ, ਉਹ ਤੈਡਾਂ ਆਰਾਧਨ ਕਰਦੇ ਹਨ, ਮੇਰੇ ਸੱਚੇ ਸੁਆਮੀ।"}, {"t": "ਇਹੁ ਸਚੁ ਸਭਨਾ ਕਾ ਖਸਮੁ ਹੈ; ਜਿਸੁ ਬਖਸੇ. ਸੋ ਜਨੁ ਪਾਵਹੇ ॥", "a": 922, "s": 318.17, "e": 331.46, "m": "ਏਹ ਸੱਚ ਸਾਰਿਆਂ ਦਾ ਸ੍ਰੋਮਣੀ ਸਾਹਿਬ ਹੈ। ਕੇਵਲ ਉਹ ਪੁਰਸ਼ ਹੀ ਇਸ ਨੂੰ ਪਾਉਂਦਾ ਹੈ, ਜਿਸ ਨੂੰ ਉਹ ਪ੍ਰਦਾਨ ਕਰਦਾ ਹੈ।"}, {"t": "ਕਹੈ ਨਾਨਕੁ. ਸਚੁ ਸੋਹਿਲਾ; ਸਚੈ ਘਰਿ ਗਾਵਹੇ ॥੩੯॥", "a": 922, "s": 331.71, "e": 342.2, "m": "ਗੁਰੂ ਜੀ ਫੁਰਮਾਉਂਦੇ ਹਨ, ਤੂੰ ਇਸ ਸੱਚੇ ਖ਼ੁਸ਼ੀ ਦੇ ਗਾਉਦ ਨੂੰ ਆਪਣੀ ਆਤਮਾ ਦੇ ਸੱਚੇ ਘਰ (ਟਿਕਾਣੇ) ਅੰਦਰ ਗਾਇਨ ਕਰ।"}]}, {"name": "ਪਉੜੀ ੪੦", "lines": [{"t": "ਅਨਦੁ ਸੁਣਹੁ ਵਡਭਾਗੀਹੋ; ਸਗਲ ਮਨੋਰਥ ਪੂਰੇ ॥", "a": 922, "s": 342.61, "e": 352.86, "m": "ਤੁਸੀਂ ਖੁਸ਼ੀ ਦੀ ਬਾਣੀ ਨੂੰ ਸ੍ਰਵਣ ਕਰੋ, ਹੇ ਭਾਰੋ ਭਾਗਾਂ ਵਾਲਿਓ! ਅਤੇ ਤੁਹਾਡੀਆਂ ਸਾਰੀਆਂ ਅਭਿਆਸ਼ਾ ਪੂਰੀਆਂ ਹੋ ਜਾਣਗੀਆਂ।"}, {"t": "ਪਾਰਬ੍ਰਹਮੁ ਪ੍ਰਭੁ ਪਾਇਆ; ਉਤਰੇ ਸਗਲ ਵਿਸੂਰੇ ॥", "a": 922, "s": 353.19, "e": 362.34, "m": "ਮੈਂ ਸੁਆਮੀ, ਸ਼੍ਰੋਮਣੀ ਸਾਹਿਬ ਨੂੰ ਪ੍ਰਾਪਤ ਕਰ ਲਿਆ ਹੈ ਅਤੇ ਮੇਰੇ ਸਾਰੇ ਗਮ ਦੂਰ ਹੋ ਗਏ ਸਨ।"}, {"t": "ਦੂਖ ਰੋਗ ਸੰਤਾਪ ਉਤਰੇ; ਸੁਣੀ ਸਚੀ ਬਾਣੀ ॥", "a": 922, "s": 362.63, "e": 371.74, "m": "ਸੱਚੀ ਗੁਰਬਾਣੀ ਨੂੰ ਸ਼੍ਰਵਣ ਕਰਨ ਦੁਆਰਾ ਮੈਂ ਤਕਲੀਫਾਂ ਬੀਮਾਰੀਆਂ ਤੇ ਕਸ਼ਟਾਂ ਤੋਂ ਖ਼ਲਾਸੀ ਪਾ ਗਿਆ ਹਾਂ।"}, {"t": "ਸੰਤ ਸਾਜਨ ਭਏ ਸਰਸੇ; ਪੂਰੇ ਗੁਰ ਤੇ ਜਾਣੀ ॥", "a": 922, "s": 372.07, "e": 381.78, "m": "ਸਾਧੂ ਤੇ ਮਿੱਤ੍ਰ ਇਸ ਨੂੰ ਪੂਰਨ ਗੁਰਾਂ ਪਾਸੋਂ ਜਾਣਨ ਦੁਆਰਾ ਪ੍ਰਸੰਨ ਹੋ ਗਏ ਹਨ।"}, {"t": "ਸੁਣਤੇ ਪੁਨੀਤ. ਕਹਤੇ ਪਵਿਤੁ; ਸਤਿਗੁਰੁ ਰਹਿਆ ਭਰਪੂਰੇ ॥", "a": 922, "s": 382.01, "e": 394.2, "m": "ਪਵਿੱਤਰ ਹਨ ਸ੍ਰੋਤੇ ਅਤੇ ਨਿਰਮਲ ਹਨ ਬਕਤੇ, ਉਹ ਸੱਚੇ ਗੁਰਾਂ ਨੂੰ ਸਾਰੇ ਵਿਆਪਕ ਵੇਖਦੇ ਹਨ।"}, {"t": "ਬਿਨਵੰਤਿ ਨਾਨਕੁ. ਗੁਰ ਚਰਣ ਲਾਗੇ; ਵਾਜੇ ਅਨਹਦ ਤੂਰੇ ॥੪੦॥੧॥", "a": 922, "s": 394.47, "e": 406.3, "m": "ਗੁਰੂ ਜੀ ਬੇਨਤੀ ਕਰਦੇ ਹਨ, ਗੁਰਾਂ ਦੇ ਪੈਰੀਂ ਪੈਣ ਨਾਲ ਪ੍ਰਾਣੀ ਲਈ ਬਿਨ ਵਜਾਏ ਵਾਜੇ ਵਜਦੇ ਹਨ।"}]}], "arthSource": "ਸਿੱਖ ਵਰਲਡ ਐਪ (AppAspect)"}, {"slug": "rehraas", "name": "ਰਹਰਾਸਿ ਸਾਹਿਬ", "mode": "single", "audio": "https://media.gursevak.com/media/Sundar_Gutka/32kbps_Audio_Quality/06_Rehras_Sahib.mp3", "duration": 2720.88, "arthSource": "ਸਿੱਖ ਵਰਲਡ ਐਪ (AppAspect)", "sections": [{"name": "੧ - ਹਰਿ ਜੁਗੁ ਜੁਗੁ ਭਗਤ ਉਪਾਇਆ ਪੈਜ ਰਖਦਾ ਆਇਆ ਰਾਮ ਰਾਜੇ", "lines": [{"t": "ਹਰਿ ਜੁਗੁ ਜੁਗੁ. ਭਗਤ ਉਪਾਇਆ; ਪੈਜ ਰਖਦਾ ਆਇਆ. ਰਾਮ ਰਾਜੇ ॥", "s": 0.43, "e": 11.0, "m": "ਹਰ ਇੱਕ ਯੁਗ ਅੰਦਰ ਵਾਹਿਗੁਰੂ ਨੇ ਆਪਣੇ ਸੰਤ ਪੈਦਾ ਕੀਤੇ ਤੇ ਉਹਨਾਂ ਦੀ ਇਜਤ ਆਬਰੂ ਰੱਖੀ।"}, {"t": "ਹਰਣਾਖਸੁ ਦੁਸਟੁ ਹਰਿ ਮਾਰਿਆ; ਪ੍ਰਹਲਾਦੁ ਤਰਾਇਆ ॥", "s": 11.23, "e": 20.52, "m": "ਪਾਂਬਰ ਹਰਨਾਖਸ਼ ਨੂੰ ਪ੍ਰਭੂ ਨੇ ਮਾਰ ਦਿੱਤਾ ਅਤੇ ਪ੍ਰਹਿਲਾਦ ਦੀ ਰੱਖਿਆ ਕੀਤੀ।"}, {"t": "ਅਹੰਕਾਰੀਆ ਨਿੰਦਕਾ. ਪਿਠਿ ਦੇਇ; ਨਾਮਦੇਉ. ਮੁਖਿ ਲਾਇਆ ॥", "s": 20.75, "e": 30.56, "m": "ਅਭਿਮਾਨੀਆਂ ਅਤੇ ਦੂਸ਼ਨ ਲਾਉਣ ਵਾਲਿਆਂ ਵੱਲ ਸੁਆਮੀ ਨੇ ਆਪਣੀ ਕੰਡ ਕਰ ਲਈ ਅਤੇ ਨਾਮ ਦੇਵ ਨੂੰ ਆਪਣਾ ਮੁਖੜਾ ਵਿਖਾਲਿਆ (ਪਿਆਰਿਆ ਸਤਿਕਾਰਿਆ)।"}, {"t": "ਜਨ ਨਾਨਕ. ਐਸਾ ਹਰਿ ਸੇਵਿਆ; ਅੰਤਿ ਲਏ ਛਡਾਇਆ ॥੪॥੧੩॥੨੦॥", "s": 30.83, "e": 39.48, "m": "ਨੌਕਰ ਨਾਨਕ ਨੇ ਆਪਣੇ ਵਾਹਿਗੁਰੂ ਦੀ ਐਸ ਤਰ੍ਹਾਂ ਸੇਵਾ ਕੀਤੀ ਹੈ ਕਿ ਅਖੀਰ ਨੂੰ ਉਹ ਉਸ ਨੂੰ ਬਚਾ ਲਵੇਗਾ।"}]}, {"name": "੨ - ਦੁਖੁ ਦਾਰੂ ਸੁਖੁ ਰੋਗੁ ਭਇਆ ਜਾ ਸੁਖੁ ਤਾਮਿ ਨ ਹੋਈ", "lines": [{"t": "ੴ ਸਤਿਗੁਰ ਪ੍ਰਸਾਦਿ ॥", "s": 41.27, "e": 48.3, "m": "ਵਾਹਿਗੁਰੂ ਕੇਵਲ ਇਕ ਹੈ। ਸੱਚੇ ਗੁਰਾਂ ਦੀ ਦਇਆ ਦੁਆਰਾ ਉਹ ਜਾਣਿਆ ਜਾਂਦਾ ਹੈ।"}, {"t": "ਸਲੋਕੁ ਮਃ ੧ ॥", "s": 48.65, "e": 50.7, "m": "ਸਲੋਕ ਪਹਿਲੀ ਪਾਤਸ਼ਾਹੀ।"}, {"t": "ਦੁਖੁ ਦਾਰੂ. ਸੁਖੁ ਰੋਗੁ ਭਇਆ; ਜਾ ਸੁਖੁ. ਤਾਮਿ ਨ ਹੋਈ ॥", "s": 52.63, "e": 63.18, "m": "ਦੁਖ ਦਵਾਈ ਹੈ, ਅਤੇ ਖੁਸ਼ੀ ਬੀਮਾਰੀ। ਜਦ ਖੁਸ਼ੀ ਹੁੰਦੀ ਹੈ, ਤਦ ਵਾਹਿਗੁਰੂ ਲਈ ਚਾਹ ਨਹੀਂ ਹੁੰਦੀ।"}, {"t": "ਤੂੰ ਕਰਤਾ ਕਰਣਾ, ਮੈ ਨਾਹੀ; ਜਾ ਹਉ ਕਰੀ. ਨ ਹੋਈ ॥੧॥", "s": 63.37, "e": 68.84, "m": "ਤੂੰ ਕਰਨਹਾਰ ਹੈਂ, ਮੈਂ ਕੁਝ ਨਹੀਂ ਕਰ ਸਕਦਾ। ਜੇਕਰ ਮੈਂ ਕੁਝ ਕਰਨ ਦੀ ਕੋਸ਼ਿਸ਼ ਭੀ ਕਰਾਂ, ਤਾਂ ਭੀ ਕੁਝ ਨਹੀਂ ਬਣਦਾ।"}, {"t": "ਬਲਿਹਾਰੀ ਕੁਦਰਤਿ ਵਸਿਆ ॥", "s": 69.39, "e": 73.44, "m": "ਕੁਰਬਾਨ ਹਾਂ ਮੈਂ ਤੇਰੇ ਉਤੋਂ। ਤੂੰ ਆਪਣੀ ਰਚਨਾ ਅੰਦਰ ਵਸਦਾ ਹੈਂ।"}, {"t": "ਤੇਰਾ ਅੰਤੁ. ਨ ਜਾਈ ਲਖਿਆ ॥੧॥ ਰਹਾਉ ॥", "s": 73.71, "e": 78.32, "m": "ਤੇਰਾ ਓੜਕ ਜਾਣਿਆਂ ਨਹੀਂ ਜਾ ਸਕਦਾ। ਠਹਿਰਾਓ।"}, {"t": "ਜਾਤਿ ਮਹਿ ਜੋਤਿ. ਜੋਤਿ ਮਹਿ ਜਾਤਾ; ਅਕਲ ਕਲਾ ਭਰਪੂਰਿ ਰਹਿਆ ॥", "s": 78.63, "e": 89.82, "m": "ਜੀਵਾਂ ਅੰਦਰ ਤੇਰੀ ਰੌਸ਼ਨੀ ਹੈ ਅਤੇ ਜੀਵ ਤੇਰੀ ਰੌਸ਼ਨੀ ਵਿੱਚ ਹਨ। ਤੂੰ, ਹੇ ਬਲਵਾਨ, ਅਗਾਧ ਸੁਆਮੀ ਸਾਰਿਆਂ ਵਿੱਚ ਪਰੀ-ਪੂਰਨ ਹੈਂ।"}, {"t": "ਤੂੰ ਸਚਾ ਸਾਹਿਬੁ. ਸਿਫਤਿ ਸੁਆਲਿੑਉ; ਜਿਨਿ ਕੀਤੀ. ਸੋ ਪਾਰਿ ਪਇਆ ॥", "s": 89.95, "e": 99.18, "m": "ਤੂੰ ਸੱਚਾ ਸੁਆਮੀ ਹੈਂ। ਸੁੰਦਰ ਹੈ ਤੇਰੀ ਕੀਰਤੀ। ਜੋ ਇਸ ਨੂੰ ਗਾਇਨ ਕਰਦਾ ਹੈ, ਉਹ ਪਾਰ ਉਤਰ ਜਾਂਦਾ ਹੈ।"},         },
        en: {
          title: "Nitnem Tracker", appName: "Nitnem", langBtn: "\u0a2a\u0a70\u0a1c\u0a3e\u0a2c\u0a40",
          arthShow: "Show Meaning", arthHide: "Hide Meaning", print: "Print",
          chooseBani: "Choose Bani",
          footCredit: "Bani and audio: Learn Shudh Gurbani (Gursevak)",
          timeLabel: "Audio time", back10: "Back 10 seconds", fwd10: "Forward 10 seconds",
          seekLabel: "Seek audio", closeLabel: "Close audio",
          play: "Play", pause: "Pause", listen: "Listen",
          playAudio: "Play audio", pauseAudio: "Pause audio",
          stateNotStarted: "Not started", stateLearning: "Learning", stateLearned: "Learned",
          section: "Section ", arthPrefix: "Meaning: ",
          partsLearned: (a, b) => a + " / " + b + " sections learned",
          nextPart: (name) => "Next section: " + name,
          allLearned: (name) => "All sections of " + name + " learned",

      function t() { return STR[lang]; }
      function fmtNum(n) { return lang === "en" ? String(n) : toGurmukhi(n); }
      function stateText(v) {
        const s = t();
        return v === "learning" ? s.stateLearning : v === "learned" ? s.stateLearned : s.stateNotStarted;
      }
      function setLang(next) {
        lang = next === "en" ? "en" : "pa";
        try { window.localStorage.setItem("nitnem-lang", lang); } catch (e) {}
        applyLang();
      }
      function applyLang() {
        const s = t();
        document.documentElement.lang = lang === "en" ? "en" : "pa";
        document.title = s.title;
        const h1 = document.querySelector(".masthead h1");
        if (h1) h1.textContent = s.appName;
        printBtn.textContent = s.print;

        langBtn.setAttribute("aria-label", lang === "en" ? "Switch to Punjabi" : "Switch to English");

        nowTime.setAttribute("aria-label", s.timeLabel);
        seekEl.setAttribute("aria-label", s.seekLabel);
        $("backBtn").setAttribute("aria-label", s.back10);
        $("fwdBtn").setAttribute("aria-label", s.fwd10);
        $("closeBtn").setAttribute("aria-label", s.closeLabel);
        $("footCredit").textContent = s.footCredit;
        renderAll();
        window.dispatchEvent(new CustomEvent("nt-lang"));
      }


      // ---- DOM refs -----------------------------------------------------------
      const $ = (id) => document.getElementById(id);
      const audio = $("audio");
      const baniNameEl = $("baniName"), learnedCountEl = $("learnedCount");
      const nextLinkEl = $("nextLink"), allDoneEl = $("allDone");
      const arthBtn = $("arthBtn"), printBtn = $("printBtn"), langBtn = $("langBtn");
      const baniStrip = $("baniStrip");
      const progressTrack = $("progressTrack"), progressFill = $("progressFill"), progressPct = $("progressPct");
      const mainEl = $("main"), sectionsEl = $("sections");
      const arthSourceEl = $("arthSource");
      const nowBar = $("nowBar"), nowTitle = $("nowTitle"), nowTime = $("nowTime");
      const seekEl = $("seek"), pauseBtn = $("pauseBtn");

      const ICON_PLAY = '<svg width="13" height="14" viewBox="0 0 13 14" fill="currentColor" aria-hidden="true"><path d="M2 1.5v11c0 .8.9 1.3 1.6.9l8-5.5c.6-.4.6-1.4 0-1.8l-8-5.5C2.9.2 2 .7 2 1.5z"/></svg>';
      const ICON_PAUSE = '<svg width="13" height="14" viewBox="0 0 13 14" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="4" height="12" rx="1"/><rect x="8" y="1" width="4" height="12" rx="1"/></svg>';

      let selectedSlug = BANIS[0] ? BANIS[0].slug : "";
      function currentBani() {
        return BANIS.find((b) => b.slug === selectedSlug) || BANIS[0];
      }
      function showArth() { return arthOn && baniHasArth(currentBani()); }

      // ---- Audio engine -------------------------------------------------------
      let session = 0;
      let segment = null; // {section, pos, lineIdx, mode, end}
      let playing = null; // {section, pos, lineIdx, mode}
      let paused = false;
      let srcUrl = null;
      let posSec = 0, durSec = 0;
      const lineEls = new Map();

      function updateNowBar() {
        if (!playing) { nowBar.hidden = true; mainEl.classList.remove("playing"); return; }
        const bani = currentBani();
        const section = bani.sections[playing.section];
        nowBar.hidden = false;
        mainEl.classList.add("playing");
        nowTitle.textContent = playing.mode === "section"
          ? t().nowListening(section.name)
          : t().nowLine(section.name, fmtNum(playing.lineIdx + 1));
        nowTime.textContent = formatTime(posSec) + " / " + formatTime(durSec);
        seekEl.value = durSec > 0 ? Math.round((posSec / durSec) * 1000) : 0;
        pauseBtn.innerHTML = paused ? ICON_PLAY + " " + t().play : ICON_PAUSE + " " + t().pause;
        pauseBtn.setAttribute("aria-label", paused ? t().playAudio : t().pauseAudio);
      }

      function refreshLineHighlights() {
        lineEls.forEach((el, key) => {
          const parts = key.split("-");
          const on = playing && playing.section === Number(parts[0]) && playing.lineIdx === Number(parts[1]);
          el.classList.toggle("playing-line", !!on);
        });
        document.querySelectorAll(".play-btn[data-section]").forEach((btn) => {
          const idx = Number(btn.getAttribute("data-section"));
          const isThis = playing && playing.section === idx && playing.mode === "section";
          const sec = currentBani().sections[idx];
          btn.innerHTML = (isThis && !paused ? ICON_PAUSE + " " + t().pause : ICON_PLAY + " " + t().listen);
          btn.setAttribute("aria-label", sec.name + " " + (isThis && !paused ? t().pause : t().listen));
        });
      }

      async function playSegment(sectionIdx, pos, mode, atTime, keepPaused) {
        const bani = currentBani();
        const section = bani.sections[sectionIdx];
        if (!section) return;
        const timed = timedEntries(section);
        const entry = timed[pos];
        if (!entry) return;
        const line = entry.line;
        const url = fileUrlFor(bani, line);
        if (!url) return;
        const mySession = ++session;

        segment = { section: sectionIdx, pos: pos, lineIdx: entry.idx, mode: mode, end: line.e };
        playing = { section: sectionIdx, pos: pos, lineIdx: entry.idx, mode: mode };
        paused = false;

        const startFileTime = atTime !== undefined ? atTime : line.s;
        let elapsed, total;
        if (mode === "line") {
          total = line.e - line.s;
          elapsed = Math.min(Math.max(startFileTime - line.s, 0), total);
        } else {
          total = timed.reduce((acc, e2) => acc + (e2.line.e - e2.line.s), 0);
          elapsed = 0;
          for (let i = 0; i < pos; i++) elapsed += timed[i].line.e - timed[i].line.s;
          elapsed += Math.min(Math.max(startFileTime - line.s, 0), line.e - line.s);
        }
        posSec = elapsed; durSec = total;
        updateNowBar(); refreshLineHighlights();

        if (srcUrl !== url) {
          srcUrl = url;
          audio.src = url;
          await new Promise((resolve) => {
            const done = () => {
              audio.removeEventListener("loadedmetadata", done);
              audio.removeEventListener("error", done);
              resolve();
            };
            audio.addEventListener("loadedmetadata", done);
            audio.addEventListener("error", done);
            audio.load();
          });
          if (mySession !== session) return;
          if (audio.error) { stopPlayback(); return; }
        }
        audio.currentTime = startFileTime;
        try {
          await audio.play();
          if (keepPaused && mySession === session) { audio.pause(); paused = true; updateNowBar(); refreshLineHighlights(); }
        } catch (e) { /* interrupted by a newer tap; newest session wins */ }
      }

      function stopPlayback() {
        session += 1;
        segment = null; playing = null; paused = false;
        audio.pause();
        posSec = 0; durSec = 0;
        updateNowBar(); refreshLineHighlights();
      }

      function togglePause() {
        if (!playing) return;
        if (paused) { audio.play(); paused = false; }
        else { audio.pause(); paused = true; }
        updateNowBar(); refreshLineHighlights();
      }

      function seekToElapsed(target) {
        const seg = segment;
        if (!seg) return;
        const section = currentBani().sections[seg.section];
        if (!section) return;
        const timed = timedEntries(section);
        if (seg.mode === "line") {
          const entry = timed[seg.pos];
          if (!entry) return;
          const line = entry.line;
          const clamped = Math.min(Math.max(target, 0), line.e - line.s);
          audio.currentTime = line.s + clamped;
          posSec = clamped;
          updateNowBar();
          return;
        }
        const total = timed.reduce((acc, e2) => acc + (e2.line.e - e2.line.s), 0);
        const clamped = Math.min(Math.max(target, 0), Math.max(total - 0.05, 0));
        let acc = 0;
        for (let i = 0; i < timed.length; i++) {
          const entry = timed[i];
          const lineDur = entry.line.e - entry.line.s;
          if (clamped <= acc + lineDur || i === timed.length - 1) {
            const fileTime = entry.line.s + (clamped - acc);
            if (i === seg.pos) {
              audio.currentTime = fileTime;
              posSec = clamped;
              updateNowBar();
            } else {
              playSegment(seg.section, i, "section", fileTime, audio.paused);
            }
            return;
          }
          acc += lineDur;
        }
      }

      audio.addEventListener("timeupdate", () => {
        const seg = segment;
        if (!seg) return;
        const section = currentBani().sections[seg.section];
        if (!section) return;
        const timed = timedEntries(section);
        const entry = timed[seg.pos];
        if (entry) {
          const line = entry.line;
          let elapsed, total;
          if (seg.mode === "line") {
            total = line.e - line.s;
            elapsed = Math.min(Math.max(audio.currentTime - line.s, 0), total);
          } else {
            total = timed.reduce((acc, e2) => acc + (e2.line.e - e2.line.s), 0);
            elapsed = 0;
            for (let i = 0; i < seg.pos; i++) elapsed += timed[i].line.e - timed[i].line.s;
            elapsed += Math.min(Math.max(audio.currentTime - line.s, 0), line.e - line.s);
          }
          posSec = elapsed; durSec = total;
          // Update the bar without rebuilding the seek slider mid-drag.
          nowTime.textContent = formatTime(posSec) + " / " + formatTime(durSec);
          if (document.activeElement !== seekEl) {
            seekEl.value = durSec > 0 ? Math.round((posSec / durSec) * 1000) : 0;
          }
        }
        if (audio.paused) return;
        if (audio.currentTime < seg.end - 0.03) return;
        if (seg.mode === "section" && seg.pos + 1 < timed.length) {
          playSegment(seg.section, seg.pos + 1, "section");
          return;
        }
        stopPlayback();
      });

      // Keep the playing line in view as a section plays through.
      let lastScrolledKey = "";
      setInterval(() => {
        if (!playing || paused) return;
        const key = playing.section + "-" + playing.lineIdx;
        if (key === lastScrolledKey) return;
        lastScrolledKey = key;
        const el = lineEls.get(key);
        if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" });
      }, 400);

      function onSectionPlayTap(sectionIdx) {
        if (playing && playing.section === sectionIdx && playing.mode === "section") { togglePause(); return; }
        playSegment(sectionIdx, 0, "section");
      }
      function onLineTap(sectionIdx, lineIdx) {
        const section = currentBani().sections[sectionIdx];
        if (!section) return;
        const timed = timedEntries(section);
        const pos = timed.findIndex((e2) => e2.idx === lineIdx);
        if (pos < 0) return;
        if (playing && playing.section === sectionIdx && playing.lineIdx === lineIdx && playing.mode === "line") { togglePause(); return; }
        playSegment(sectionIdx, pos, "line");
      }

      // ---- Rendering ------------------------------------------------------------
      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined) n.textContent = text;
        return n;
      }

      function renderHeader() {
        const bani = currentBani();
        baniNameEl.textContent = bani.name;
        const statefulIdx = [];
        bani.sections.forEach((s, i) => { if (isPlayable(s)) statefulIdx.push(i); });
        const learnedCount = statefulIdx.filter((i) => stateOf(bani.slug, i) === "learned").length;
        learnedCountEl.textContent = t().partsLearned(fmtNum(learnedCount), fmtNum(statefulIdx.length));
        const next = statefulIdx.find((i) => stateOf(bani.slug, i) !== "learned");
        if (next !== undefined) {
          nextLinkEl.hidden = false;
          nextLinkEl.textContent = t().nextPart(bani.sections[next].name);
          nextLinkEl.onclick = () => {
            const target = document.getElementById("section-" + next);
            if (target) target.scrollIntoView({ block: "start", behavior: "smooth" });
          };
          allDoneEl.hidden = true;
        } else {
          nextLinkEl.hidden = true;
          if (statefulIdx.length > 0) {
            allDoneEl.hidden = false;
            allDoneEl.textContent = t().allLearned(bani.name);
          } else allDoneEl.hidden = true;
        }

        const hasArth = baniHasArth(bani);
        arthBtn.hidden = !hasArth;
        arthBtn.setAttribute("aria-pressed", arthOn ? "true" : "false");
        arthBtn.textContent = arthOn ? t().arthHide : t().arthShow;
        arthBtn.classList.toggle("on", arthOn);

        // Bani selector pills
        baniStrip.innerHTML = "";
        BANIS.forEach((b) => {
          let learned = 0, total = 0;
          b.sections.forEach((s, i) => {
            if (!isPlayable(s)) return;
            total += 1;
            if (stateOf(b.slug, i) === "learned") learned += 1;
          });
          const btn = el("button", "bani-tab" + (b.slug === bani.slug ? " selected" : ""));
          btn.type = "button";
          btn.setAttribute("role", "tab");
          btn.setAttribute("aria-selected", b.slug === bani.slug ? "true" : "false");
          const name = el("span", "bn", b.name);
          btn.appendChild(name);
          if (total > 0) btn.appendChild(el("span", "bc", t().tabLearned(fmtNum(learned), fmtNum(total))));
          btn.addEventListener("click", () => selectBani(b.slug));
          baniStrip.appendChild(btn);
        });

        const pct = statefulIdx.length > 0 ? Math.round((learnedCount / statefulIdx.length) * 100) : 0;
        progressFill.style.width = pct + "%";
        progressPct.textContent = fmtNum(pct) + "%";
        progressTrack.setAttribute("aria-valuenow", learnedCount);
        progressTrack.setAttribute("aria-valuemax", statefulIdx.length);
        progressTrack.setAttribute("aria-label", t().progressLabel(bani.name));

        if (showArth() && bani.arthSource) {
          arthSourceEl.hidden = false;
          arthSourceEl.textContent = t().arthPrefix + bani.arthSource;
        } else arthSourceEl.hidden = true;
      }

      function renderSections() {
        const bani = currentBani();
        const arth = showArth();
        sectionsEl.innerHTML = "";
        lineEls.clear();

        bani.sections.forEach((section, sectionIdx) => {
          const playable = isPlayable(section);
          const delay = Math.min(sectionIdx, 6) * 60;

          if (!playable) {
            // Display-only section (e.g. ਆਰੰਭ): centered heading lines.
            const sec = el("section", "leaf display-only");
            sec.id = "section-" + sectionIdx;
            sec.style.animationDelay = delay + "ms";
            section.lines.forEach((line) => {
              sec.appendChild(el("p", "big-line", line.t));
              if (arth && line.m) sec.appendChild(el("p", "arth-line no-print", line.m));
            });
            sectionsEl.appendChild(sec);
            return;
          }

          const card = el("article", "paudi-card leaf");
          card.id = "section-" + sectionIdx;
          card.style.animationDelay = delay + "ms";

          const head = el("div", "card-head no-print");
          const headLeft = el("div");
          headLeft.appendChild(el("p", "sec-kicker font-label", t().section + fmtNum(sectionIdx + 1)));
          headLeft.appendChild(el("h2", "sec-name font-display", section.name));
          headLeft.appendChild(el("span", "sec-dur font-label", formatTime(sectionDuration(section))));
          head.appendChild(headLeft);
          const playBtn = el("button", "play-btn");
          playBtn.type = "button";
          playBtn.setAttribute("data-section", sectionIdx);
          playBtn.innerHTML = ICON_PLAY + " " + t().listen;
          playBtn.setAttribute("aria-label", section.name + " " + t().listen);
          playBtn.addEventListener("click", () => onSectionPlayTap(sectionIdx));
          head.appendChild(playBtn);
          card.appendChild(head);

          card.appendChild(el("h2", "print-sec-name", section.name));

          const linesBox = el("div", "lines");
          section.lines.forEach((line, lineIdx) => {
            const timed = isTimed(line);
            const p = el("p", "bani-line" + (timed ? " timed" : ""), line.t);
            if (timed) {
              p.setAttribute("role", "button");
              p.tabIndex = 0;
              p.setAttribute("aria-label", t().lineListen(line.t));
              p.addEventListener("click", () => onLineTap(sectionIdx, lineIdx));
              p.addEventListener("keydown", (ev) => {
                if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); onLineTap(sectionIdx, lineIdx); }
              });
              lineEls.set(sectionIdx + "-" + lineIdx, p);
            }
            linesBox.appendChild(p);
            if (arth && line.m) linesBox.appendChild(el("p", "arth-line no-print", line.m));
          });
          card.appendChild(linesBox);

          const stateRow = el("div", "state-row no-print");
          stateRow.setAttribute("role", "radiogroup");
          stateRow.setAttribute("aria-label", t().stateLabel(section.name));
          const current = stateOf(bani.slug, sectionIdx);
          STATE_OPTIONS.forEach((opt) => {
            const b = el("button", "state-btn" + (current === opt.value ? " sel" + (opt.value === "learned" ? " learned" : "") : ""), stateText(opt.value));
            b.type = "button";
            b.setAttribute("role", "radio");
            b.setAttribute("aria-checked", current === opt.value ? "true" : "false");
            b.addEventListener("click", () => {
              setState(bani.slug, sectionIdx, opt.value);
              renderHeader();
              renderSections();
              refreshLineHighlights();
            });
            stateRow.appendChild(b);
          });
          card.appendChild(stateRow);
          sectionsEl.appendChild(card);
        });
      }

      function renderAll() { renderHeader(); renderSections(); refreshLineHighlights(); updateNowBar(); }

      function selectBani(slug) {
        if (slug === selectedSlug) return;
        stopPlayback();
        selectedSlug = slug;
        lastScrolledKey = "";
        renderAll();
        window.scrollTo({ top: 0 });
      }

      arthBtn.addEventListener("click", () => { arthOn = !arthOn; persistArth(); renderAll(); });
      printBtn.addEventListener("click", () => window.print());
      langBtn.addEventListener("click", () => setLang(lang === "en" ? "pa" : "en"));
      pauseBtn.addEventListener("click", togglePause);
