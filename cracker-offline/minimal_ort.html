<!DOCTYPE html><html><body><div id="log">start</div>
<script src="vendor/ort.wasm.min.js"></script>
<script>
var log = function(m){ document.getElementById('log').textContent += ' | ' + m; };
window.addEventListener('error', function(e){ log('ERR ' + e.message); });
(async function(){
  try {
    ort.env.wasm.numThreads = 1;
    ort.env.wasm.wasmPaths = "vendor/";
    log('creating session from URL...');
    var s = await ort.InferenceSession.create("https://huggingface.co/surindersinghssj/indicconformer-pa-v3-kirtan/resolve/main/onnx-pa-only/int8/indicconformer-pa-ctc.onnx", { executionProviders: ['wasm'], graphOptimizationLevel: 'disabled', executionMode: 'sequential' });
    log('SESSION OK inputs=' + s.inputNames.join(','));
    // tiny inference: 2s of silence -> 200 frames
    var T = 200, data = new Float32Array(80*T);
    var out = await s.run({ audio_signal: new ort.Tensor('float32', data, [1,80,T]), length: new ort.Tensor('int64', BigInt64Array.from([BigInt(T)]), [1]) });
    log('RUN OK out dims=' + out.logprobs.dims.join('x'));
  } catch(e){ log('FAIL ' + (e && e.message)); }
})();
</script></body></html>
